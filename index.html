<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#fffdf9">
<title>厨房 DIY 设计 v11.05</title>
<style>
:root{
  --bg:#f3efe7; --paper:#f7f4ee; --panel:#fffdf9; --line:#e3dccf; --ink:#2b2824; --muted:#8a8174;
  --accent:#b5653a; --accent-soft:#f3e3d8; --teal:#2f5d62;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden;overscroll-behavior:none;touch-action:manipulation;
  -webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;
  font:13px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
button,input,select{font:inherit;color:inherit}
.app{display:grid;grid-template-rows:auto minmax(0,1fr) 30px;grid-template-columns:236px minmax(0,1fr) 300px;height:100vh;height:100dvh;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input{-webkit-user-select:text;user-select:text}
header{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:8px 14px;
  background:var(--panel);border-bottom:1px solid var(--line)}
.brand{display:flex;flex-direction:column;margin-right:8px;line-height:1.25}
.brand b{font-size:15px;letter-spacing:.5px}
.brand span{color:var(--muted);font-size:12px}
.grp{display:flex;align-items:center;gap:2px;padding:2px;border:1px solid var(--line);border-radius:8px;background:#fff}
.btn{border:0;background:transparent;padding:5px 9px;border-radius:6px;cursor:pointer;white-space:nowrap}
.btn:hover{background:#f2ece2}
.btn.on{background:var(--ink);color:#fff}
.btn.chip.on{background:var(--accent-soft);color:var(--accent)}
#langSel .btn{min-width:32px;font-weight:500}
.btn.primary{background:var(--accent);color:#fff}
.btn.primary:hover{background:#9f5530}
.btn.danger{color:#b3372a}
.spacer{flex:1}
aside{background:var(--panel);overflow:auto;border-right:1px solid var(--line)}
aside.right{border-right:0;border-left:1px solid var(--line)}
.lib h4{margin:0;padding:12px 14px 6px;font-size:12px;color:var(--muted);font-weight:600;letter-spacing:1px}
.lib-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:0 10px 6px}
.lib h4{position:sticky;top:0;z-index:1;background:var(--panel)}
.item{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px 6px;border:1px solid var(--line);
  border-radius:8px;background:#fff;cursor:grab;user-select:none;touch-action:pan-y;transition:border-color .15s,transform .15s}
.item.dragging{border-color:var(--accent);opacity:.5}
@media (hover:hover){.item:hover{border-color:var(--accent);transform:translateY(-1px)}}
#ghost{position:fixed;left:0;top:0;z-index:30;pointer-events:none;opacity:.8;transform:translate(-50%,-50%);filter:drop-shadow(0 4px 10px rgba(40,30,20,.3))}
#ghost svg{width:100%;height:100%;display:block;overflow:visible}
.item svg{width:56px;height:44px}
.item b{font-weight:500;font-size:12px}
.item small{color:var(--muted);font-size:11px}
.hint{padding:10px 14px 16px;color:var(--muted);font-size:12px}
main{position:relative;overflow:hidden;background:var(--paper)}
#plan{width:100%;height:100%;display:block;touch-action:none;cursor:default}
#plan.panning{cursor:grabbing}
#plan.tool-measure{cursor:crosshair}
#plan .wall{pointer-events:none}
#plan.tool-select .wall{pointer-events:all;cursor:grab}
#plan.tool-demolish .wall{pointer-events:all;cursor:pointer}
#plan.tool-demolish .wall:hover{fill:#d9894f}
#plan.tool-select .room:hover{opacity:.82}
#plan .furn{cursor:move}
@media (hover:hover){#plan .furn:hover{filter:drop-shadow(0 0 2px rgba(181,101,58,.7))}}
[data-handle]{cursor:pointer}
[data-handle=size]{cursor:nwse-resize}
.scalebar{position:absolute;left:14px;bottom:12px;background:rgba(255,253,249,.92);border:1px solid var(--line);
  border-radius:8px;padding:6px 10px;font-size:12px;pointer-events:none}
.scalebar .bar{height:6px;border:1.5px solid var(--ink);border-top:0;margin-top:3px}
.modehint{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:var(--ink);color:#fff;
  padding:5px 12px;border-radius:20px;font-size:12px;opacity:0;transition:opacity .2s;pointer-events:none}
.modehint.show{opacity:.9}
footer{grid-column:1/-1;display:flex;gap:18px;align-items:center;padding:0 14px;background:var(--panel);overflow:hidden;white-space:nowrap;
  border-top:1px solid var(--line);color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
#tip{overflow:hidden;text-overflow:ellipsis}
footer b{color:var(--ink);font-weight:500}
#panel section{padding:12px 16px;border-bottom:1px solid var(--line)}
#panel h3{margin:0 0 8px;font-size:13px}
#panel h3 small{color:var(--muted);font-weight:400;margin-left:6px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
td{padding:4px 2px;border-bottom:1px dashed #eee6d9}
td.r{text-align:right}
tr.click{cursor:pointer}
tr.click:hover td{background:#faf5ee}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;border:1px solid rgba(0,0,0,.15);vertical-align:-2px;margin-right:6px}
.total{display:flex;justify-content:space-between;margin-top:8px;font-size:14px}
.total b{color:var(--accent)}
.muted{color:var(--muted)}
.form{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.form label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
.form label.full{grid-column:1/-1}
.form input,.form select{border:1px solid var(--line);border-radius:6px;padding:5px 7px;background:#fff;width:100%}
.form input[type=color]{padding:2px;height:30px}
.actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.actions .btn{border:1px solid var(--line);background:#fff}
.mats{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.mat{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:6px;background:#fff;cursor:pointer;text-align:left}
.mat.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.mat i{width:26px;height:26px;border-radius:5px;border:1px solid rgba(0,0,0,.12);flex:none}
.mat span{font-size:12px;line-height:1.3}
.mat small{display:block;color:var(--muted)}
.kbd{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:12px;color:var(--muted)}
kbd{font:11px ui-monospace,Menlo,monospace;background:#f2ece2;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;color:var(--ink)}
.big{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:6px}
.stats div{background:#faf6ef;border-radius:8px;padding:8px}
.stats small{display:block;color:var(--muted);font-size:11px}
#toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;
  padding:8px 16px;border-radius:8px;opacity:0;transition:.25s;pointer-events:none;z-index:2000}
#toast.show{opacity:1;transform:translateX(-50%)}
/* ---------- 2D / 3D 切换 ---------- */
.seg{position:relative;padding:3px}
.seg .btn{position:relative;z-index:1;width:82px;transition:color .45s}
.seg .btn:hover{background:transparent}
.seg .pill{position:absolute;left:3px;top:3px;bottom:3px;width:82px;border-radius:6px;background:var(--accent);
  box-shadow:0 2px 6px rgba(181,101,58,.35);transition:transform .5s cubic-bezier(.65,0,.35,1)}
.seg .btn[data-view="2d"],body.m3d .seg .btn[data-view="3d"]{color:#fff}
body.m3d .seg .btn[data-view="2d"]{color:var(--ink)}
body.m3d .seg .pill{transform:translateX(84px)}
body.busy .seg{pointer-events:none}
body.m3d .only2d,body:not(.m3d) .only3d{display:none!important}
.only2d,.only3d{animation:fadeIn .45s ease both}
@keyframes fadeIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
#plan{transition:opacity .45s ease,transform .45s ease}
main.is3d #plan{opacity:0;pointer-events:none}
.scalebar{transition:opacity .3s}
main.is3d .scalebar{opacity:0}
#view3d{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .45s ease,visibility 0s linear .45s}
main.is3d #view3d{opacity:1;visibility:visible;transition:opacity .45s ease}
#view3d canvas{display:block;outline:none}
#walkOverlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(30,28,25,.35);z-index:3;cursor:pointer}
#walkOverlay>div{background:var(--panel);border-radius:14px;padding:22px 28px;text-align:center;max-width:360px}
#walkOverlay h3{margin:0 0 6px}
#walkOverlay p{margin:4px 0;color:var(--muted)}
#cross{position:absolute;left:50%;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;z-index:2;display:none;pointer-events:none}
#cross:before,#cross:after{content:"";position:absolute;background:#fff;box-shadow:0 0 2px #000}
#cross:before{left:6px;top:0;width:2px;height:14px}#cross:after{top:6px;left:0;height:2px;width:14px}
#hint3d{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:rgba(43,40,36,.82);color:#fff;border-radius:20px;
  padding:5px 14px;font-size:12px;z-index:2;pointer-events:none;white-space:nowrap;transition:opacity .4s}
main.animating #hint3d{opacity:0}
.rlabel{font-size:12px;font-weight:600;color:#2b2824;background:rgba(255,253,249,.9);border:1px solid var(--line);
  border-radius:12px;padding:2px 9px;white-space:nowrap;pointer-events:none}
.rlabel small{font-weight:400;color:var(--muted);margin-left:4px}
#roomList{padding:0 10px 6px;display:grid;grid-template-columns:1fr 1fr;gap:4px}
#roomList button{display:flex;flex-direction:column;width:100%;border:1px solid var(--line);background:#fff;padding:5px 8px;border-radius:7px;cursor:pointer;text-align:left;line-height:1.3}
#roomList button:hover{background:#f2ece2}
#roomList button.on{background:var(--accent-soft);color:var(--accent)}
#roomList small{color:var(--muted);font-variant-numeric:tabular-nums}
.range{display:flex;align-items:center;gap:6px;padding:0 8px;color:var(--muted);font-size:12px}
.range input{width:100px;accent-color:var(--accent)}
.menu{position:relative}
.menu summary{list-style:none;border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 12px}
.menu summary::-webkit-details-marker{display:none}
.menu-pop{position:absolute;right:0;top:calc(100% + 6px);display:flex;flex-direction:column;min-width:150px;background:#fff;
  border:1px solid var(--line);border-radius:10px;padding:4px;box-shadow:0 10px 30px rgba(40,30,20,.14);z-index:20;animation:fadeIn .2s ease}
.menu-pop .btn{text-align:left}
.range span{font-variant-numeric:tabular-nums;color:var(--ink)}
/* ---------- 选中后的浮动工具条 ---------- */
#fab{position:absolute;left:50%;bottom:16px;transform:translate(-50%,12px);display:flex;align-items:center;gap:4px;padding:5px;
  background:rgba(255,253,249,.97);border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 26px rgba(40,30,20,.16);
  z-index:4;opacity:0;visibility:hidden;transition:opacity .2s,transform .2s,visibility 0s linear .2s;max-width:calc(100% - 24px)}
main.drawer-panel #fab{opacity:0;visibility:hidden}
#fab.show{opacity:1;visibility:visible;transform:translate(-50%,0);transition:opacity .2s,transform .2s}
#fab .name{padding:0 8px 0 6px;font-weight:600;max-width:9em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#fab .btn{border:1px solid transparent}
#fab .sep{width:1px;align-self:stretch;margin:4px 2px;background:var(--line)}
/* ---------- 触屏漫游摇杆 ---------- */
#joy{position:absolute;left:28px;bottom:28px;width:130px;height:130px;border-radius:50%;background:rgba(255,253,249,.25);
  border:2px solid rgba(255,255,255,.7);box-shadow:0 4px 18px rgba(0,0,0,.18);z-index:3;display:none;touch-action:none;backdrop-filter:blur(3px)}
#joy i{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:rgba(255,253,249,.92);
  box-shadow:0 2px 8px rgba(0,0,0,.25);pointer-events:none}
#walkExit{position:absolute;right:16px;bottom:28px;z-index:3;display:none}
/* ---------- 触屏：加大点击区域 ---------- */
@media (pointer:coarse){
  body{font-size:14px}
  header{padding:8px 12px;gap:8px}
  .grp{padding:3px;border-radius:10px}
  .btn{padding:8px 12px;min-height:38px;border-radius:8px}
  .seg .btn,.seg .pill{width:92px}
  body.m3d .seg .pill{transform:translateX(94px)}
  .menu summary{padding:9px 14px}
  .menu-pop .btn{padding:11px 14px}
  .item{padding:10px 4px 8px}
  .form input,.form select{font-size:16px;padding:8px 9px}
  .form input[type=color]{height:40px}
  .actions .btn,#fab .btn{min-height:42px;padding:9px 14px}
  td{padding:7px 2px}
  #roomList button{padding:8px 10px}
  .mat{padding:9px 8px}
  .range input{width:120px!important}
}
/* ---------- 竖屏 / 窄屏（如 iPad 竖握）：侧栏改为抽屉 ---------- */
/* ---------- 宽屏：左右面板可收起 ---------- */
@media (min-width:1101px){
  .app{transition:grid-template-columns .3s cubic-bezier(.3,.7,.3,1)}
  .app.hide-lib{grid-template-columns:0 minmax(0,1fr) 300px}
  .app.hide-panel{grid-template-columns:236px minmax(0,1fr) 0}
  .app.hide-lib.hide-panel{grid-template-columns:0 minmax(0,1fr) 0}
  .app.hide-lib aside.lib,.app.hide-panel aside.right{overflow:hidden;border:0}
  aside{overflow-x:hidden}
  aside.lib>div{min-width:220px} #panel{min-width:284px}   /* 收起动画中内容不被挤压变形 */
}
/* ---------- 空白引导 / 户型模板 / 画墙 / 配色 ---------- */
#welcome{position:absolute;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;
  background:rgba(247,244,238,.55);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
#welcome[hidden]{display:none}
.wel-card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:32px 38px;text-align:center;
  box-shadow:0 14px 44px rgba(40,30,20,.16);max-width:430px;margin:16px;animation:fadeIn .4s ease}
.wel-card h2{margin:0 0 6px;font-size:19px;letter-spacing:.5px}
.wel-card p{margin:0 0 20px;color:var(--muted);font-size:13px}
.wel-btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.wel-btns .btn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:14px 20px;font-size:14px;
  display:flex;flex-direction:column;gap:3px;align-items:center;min-width:150px}
.wel-btns .btn small{color:var(--muted);font-size:11px}
.wel-btns .btn:hover{border-color:var(--accent);color:var(--accent)}
.tpl-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.tpl-grid .btn{display:flex;flex-direction:column;align-items:flex-start;gap:2px;border:1px solid var(--line);
  background:#fff;border-radius:8px;padding:8px 10px;cursor:pointer;text-align:left;line-height:1.3}
.tpl-grid .btn:hover{border-color:var(--accent);color:var(--accent)}
.tpl-grid .btn small{color:var(--muted);font-variant-numeric:tabular-nums}
.swatches{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.swatches .swb{width:24px;height:24px;border-radius:6px;border:1px solid rgba(0,0,0,.14);cursor:pointer;padding:0}
.swatches .swb:hover{transform:scale(1.12)}
.swatches .swb.on{box-shadow:0 0 0 2px var(--accent-soft),0 0 0 3.5px var(--accent)}
.swatches input[type=color]{width:34px;height:26px;padding:1px;border:1px solid var(--line);border-radius:6px;background:#fff;cursor:pointer}
.cgroup{margin-bottom:12px}
.cgroup>div:first-child{font-size:12px;margin-bottom:5px}
.cgroup .note{color:var(--muted);font-size:11px;font-weight:400}
#plan.tool-draw .wall{pointer-events:all;cursor:pointer}
#plan.tool-draw .wall:hover{fill:#d9894f}
#plan .wall.wsel{stroke:#b5653a;stroke-width:2;stroke-dasharray:6 3;vector-effect:non-scaling-stroke}
.narrow-only{display:none!important}
@media (max-width:1100px){
  .grp.narrow-only{display:flex!important}
  .btn.narrow-only,#fab .btn.narrow-only{display:inline-block!important}
  .app{grid-template-columns:minmax(0,1fr)}
  main,aside.lib,aside.right{grid-row:2;grid-column:1}
  aside.lib,aside.right{position:relative;z-index:6;width:min(320px,86vw);transition:transform .3s cubic-bezier(.3,.7,.3,1),box-shadow .3s}
  aside.lib{justify-self:start;transform:translateX(-110%)}
  aside.right{justify-self:end;transform:translateX(110%)}
  aside.open{transform:none;box-shadow:0 0 30px rgba(40,30,20,.18)}
  .lib-grid{grid-template-columns:1fr 1fr 1fr}
  .brand span,footer .only2d{display:none!important}
}
.dxf-mask{position:fixed;inset:0;z-index:99;background:rgba(38,36,31,.45);display:flex;align-items:center;justify-content:center}
.dxf-dlg{background:var(--panel);border-radius:14px;padding:20px 22px;width:min(440px,92vw);max-height:82vh;overflow:auto;box-shadow:0 14px 44px rgba(0,0,0,.3)}
.dxf-dlg h3{margin:0 0 8px}
.dxf-layers{margin:10px 0;display:flex;flex-direction:column;gap:6px;max-height:38vh;overflow:auto;padding:2px}
.dxf-layers label{display:flex;gap:8px;align-items:center;font-size:14px;cursor:pointer}
.dxf-layers .muted{margin-left:auto}
.dxf-row{display:flex;justify-content:space-between;align-items:center;margin:12px 0;font-size:14px;gap:10px}
.dxf-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
/* 标尺数字点击编辑 + 画布内联输入框 */
#gDims text[data-dim]{pointer-events:all;cursor:pointer}
#gDims text[data-wlen]{pointer-events:all;cursor:pointer}
#gDims text[data-wlen]:hover{fill:#b5653a}
#gDims text[data-dim]:hover{fill:#b5653a;font-weight:600}
#dimEdit{position:fixed;z-index:99;width:130px;transform:translate(-50%,-50%);padding:9px 10px;border:1.5px solid #b5653a;border-radius:10px;font-size:15px;font-weight:600;text-align:center;background:#fffdf9;color:#3d3a34;box-shadow:0 8px 28px rgba(61,58,52,.22);outline:none}
#dimEdit.wallSpec{width:auto;padding:10px 12px;display:flex;gap:8px;align-items:center;transform:translate(-50%,-100%)}
#dimEdit.wallSpec label{font-size:12px;font-weight:500;color:#8a8378;display:flex;align-items:center;gap:4px;white-space:nowrap}
#dimEdit.wallSpec input{width:66px;padding:6px;border:1px solid #d8d2c4;border-radius:7px;font-size:14px;font-weight:600;text-align:center;background:#fff;color:#3d3a34;outline:none}
#dimEdit.wallSpec button{padding:7px 14px;border:0;border-radius:7px;background:#b5653a;color:#fff;font-size:13px;font-weight:600;cursor:pointer}
/* 自定义编辑模式 */
.edToggle{margin:10px 0 0;width:100%;padding:9px;border:1.5px dashed #c8bfae;border-radius:9px;background:#faf8f3;color:#8a8378;font-size:13px;font-weight:600;cursor:pointer}
.edToggle:hover{border-color:#b5653a;color:#b5653a}
body.editing .edToggle{border-style:solid;border-color:#b5653a;background:#b5653a;color:#fff}
body.editing .item{position:relative;cursor:pointer}
body.editing .item::after{content:'✎';position:absolute;top:2px;right:4px;font-size:12px;color:#b5653a;font-style:normal}
.catBar{display:flex;align-items:center;justify-content:space-between}
.catBar h4{margin-bottom:0}
.catBar .mini{border:0;background:none;color:#b5653a;font-size:14px;cursor:pointer;padding:2px 6px;border-radius:5px}
.catBar .mini:hover{background:#f3e8dd}
.edBar{margin-top:12px;padding-top:10px;border-top:1px dashed #d8d2c4;display:flex;flex-wrap:wrap;gap:6px}
.edBar button{flex:1 1 45%;padding:8px 4px;border:1px solid #d8d2c4;border-radius:8px;background:#fff;color:#6b6455;font-size:12px;font-weight:600;cursor:pointer}
.edBar button:hover{border-color:#b5653a;color:#b5653a}
.edBar .warn{color:#b04a3a}
#cfgEdit{position:fixed;z-index:100;left:50%;top:50%;transform:translate(-50%,-50%);width:min(320px,92vw);max-height:86vh;overflow:auto;background:#fffdf9;border:1.5px solid #b5653a;border-radius:14px;padding:16px;box-shadow:0 16px 50px rgba(61,58,52,.3)}

<script>
/* ======================= 多语言（中文 / English，默认中文） ======================= */
const LANG_KEY = 'huxing-lang';
const LANGS = ['zh', 'zht', 'en'];             // 简体 / 繁體（台湾用字）/ English
let LANG = (() => { try { const l = localStorage.getItem(LANG_KEY); return LANGS.includes(l) ? l : 'zh'; } catch(e) { return 'zh'; } })();

const S2T_PHRASES = [['布置','佈置'],['布局','佈局'],['台面','檯面'],['复制','複製']];
const S2T = new Map(('与與两兩个個为為书書于於仅僅从從价價会會传傳体體余餘侧側倾傾储儲儿兒关關内內写寫净淨准準击擊则則刚剛删刪制製办辦动動势勢区區单單占佔卧臥卫衛厅廳历歷压壓厨廚双雙发發变變叶葉后後吗嗎听聽启啟哑啞围圍图圖圆圓场場坐座块塊垫墊墙牆处處备備复復头頭妆妝婴嬰实實宽寬对對导導层層屉屜属屬岛島带帶干乾并並库庫应應开開当當径徑态態总總悬懸懒懶户戶护護拟擬择擇挂掛挡擋挤擠损損换換据據摆擺摇搖撑撐数數无無时時显顯暂暫机機杂雜杆桿条條来來松鬆构構柜櫃标標栈棧栏欄样樣梁樑棱稜椭橢横橫橱櫥气氣没沒注註浅淺测測浏瀏游遊滚滾满滿灯燈灵靈点點热熱状狀独獨环環现現电電画畫监監盖蓋盘盤砖磚确確离離积積称稱竖豎筑築签籤类類约約级級线線结結绕繞绘繪给給统統继繼绿綠缀綴编編缝縫缩縮网網联聯脚腳获獲虚虛装裝见見视視览覽触觸计計认認让讓议議记記设設识識译譯该該语語请請读讀调調负負败敗质質贴貼赶趕转轉轮輪软軟轴軸轻輕载載较較辅輔辑輯边邊过過这這进進远遠适適选選邻鄰里裡针針钢鋼钮鈕铰鉸铺鋪销銷锁鎖键鍵镜鏡长長门門闭閉闲閒间間阅閱阳陽阴陰阶階随隨隐隱静靜页頁顶頂项項顺順颜顏飘飄飞飛马馬鸟鳥齐齊龙龍烟煙').match(/../gu).map(p => [...p]));
const s2t = s => S2T_PHRASES.reduce((a, [f, t]) => a.replaceAll(f, t), s).replace(/[\u3400-\u9fff]/g, c => S2T.get(c) || c);
const tr = (zh, en) => LANG === 'en' ? en : LANG === 'zht' ? s2t(zh) : zh;
// 内置的房间 / 材料 / 家具名称存的是中文；英文界面下显示译名，用户自己改过的名称原样显示
const NAMES_EN = {
  '厨房':'Kitchen', '厨房门':'Kitchen Door',
  '橡木地板':'Oak Flooring', '胡桃木地板':'Walnut Flooring', '800 地砖':'800 Tile', '600 地砖':'600 Tile', '大理石':'Marble',
  '300 防滑砖':'300 Anti-slip Tile', '水磨石':'Terrazzo', '满铺地毯':'Wall-to-wall Carpet',
  '橱柜':'Cabinets', '厨电':'Kitchen Appliances', '餐桌':'Dining Table', '其他':'Others',
  '六人餐桌':'6-Seat Dining Table', '圆桌':'Round Table', '餐椅':'Dining Chair', '岛台':'Kitchen Island',
  '吧椅':'Bar Stool', '橱柜台面':'Kitchen Counter', '地柜':'Base Cabinet', '吊柜':'Wall Cabinet', '高柜':'Tall Cabinet',
  '转角柜':'Corner Cabinet', '燃气灶':'Gas Stove', '油烟机':'Range Hood', '水槽':'Sink', '洗碗机':'Dishwasher',
  '蒸烤箱高柜':'Oven Tower', '消毒柜':'Sterilizer Cabinet', '微波炉':'Microwave', '小烤箱':'Mini Oven',
  '冰箱':'Fridge', '对开门冰箱':'French-door Fridge', '餐边柜':'Sideboard',
  '洗衣机':'Washer', '烘干机':'Dryer', '空气净化器':'Air Purifier', '垃圾桶':'Trash Bin',
};
const nm = s => LANG === 'en' ? (NAMES_EN[s] ?? s) : LANG === 'zht' ? s2t(s) : s;
// 静态文案：元素上写 data-en / data-en-title，中文原文首次切换时存进 dataset
function applyStaticLang(){
  document.documentElement.lang = {zh:'zh-CN', zht:'zh-TW', en:'en'}[LANG];
  document.title = tr('厨房 DIY 设计', 'Kitchen DIY Designer');
  document.querySelectorAll('[data-en]').forEach(el => { el.dataset.zh ??= el.textContent; el.textContent = tr(el.dataset.zh, el.dataset.en); });

  document.querySelectorAll('#langSel [data-lang]').forEach(b => { const on = b.dataset.lang === LANG; b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); });
}

/* ============================================================
 *  厨房户型数据（单位 mm，原点 = 左侧外墙内皮 / 顶部外墙内皮）

// 墙体：[x0,y0,x1,y1,类型]  b=承重(黑) e=外墙 n=可拆非承重 low=矮墙
let WALLS = [];
// 窗
let WINS = [];
// 平开门：洞口、铰点、关闭方向、开启方向、门宽
let DOORS = [];
// 推拉门
let SLIDES = [];
const R = (x0,y0,x1,y1) => [[x0,y0],[x1,y0],[x1,y1],[x0,y1]];
let ROOMS = [];

/* ---------- 预置户型模板 ---------- */
// U 型：净 3200×2050，顶墙 1500 窗，底墙 800 门洞，右上角 400×400 烟道井（承重）
const TPL_U = () => ({
  walls:[[-240,-240,850,0,'e'],[2350,-240,3440,0,'e'],
    [-240,2050,240,2290,'e'],[1040,2050,3440,2290,'e'],
    [-240,0,0,2290,'e'],[3200,-240,3440,2050,'e'],
    [2800,0,3200,400,'b']],
  wins:[[850,-240,2350,0]],
  doors:[{name:'厨房门',rect:[240,2050,1040,2290],h:[1040,2050],c:[-1,0],o:[0,-1],len:800,entry:true}],
  slides:[],
  rooms:[{id:'kitchen', name:'厨房', poly:R(0,0,3200,2050), mat:'antislip', at:[1600,1025]}],
});
// 一字型：净 3600×2100，顶墙 1500 窗，底墙 800 门洞，右上角烟道井
const TPL_I = () => ({
  walls:[[-240,-240,900,0,'e'],[2400,-240,3840,0,'e'],
    [-240,2100,600,2340,'e'],[1400,2100,3840,2340,'e'],
    [-240,0,0,2340,'e'],[3600,-240,3840,2100,'e'],
    [3200,0,3600,400,'b']],
  wins:[[900,-240,2400,0]],
  doors:[{name:'厨房门',rect:[600,2100,1400,2340],h:[1400,2100],c:[-1,0],o:[0,-1],len:800,entry:true}],
  slides:[],
  rooms:[{id:'kitchen', name:'厨房', poly:R(0,0,3600,2100), mat:'antislip', at:[1800,1050]}],
});
// L 型：净 3200×2400，顶墙 1400 窗，底墙 800 门洞，左上角烟道井
const TPL_L = () => ({
  walls:[[-240,-240,800,0,'e'],[2200,-240,3440,0,'e'],
    [-240,2400,400,2640,'e'],[1200,2400,3440,2640,'e'],
    [-240,0,0,2640,'e'],[3200,-240,3440,2400,'e'],
    [0,0,400,400,'b']],
  wins:[[800,-240,2200,0]],
  doors:[{name:'厨房门',rect:[400,2400,1200,2640],h:[1200,2400],c:[-1,0],o:[0,-1],len:800,entry:true}],
  slides:[],

// 二字型：净 3600×2400，顶墙 1500 窗，底墙 800 门洞，右上角烟道井
const TPL_II = () => ({
  walls:[[-240,-240,1050,0,'e'],[2550,-240,3840,0,'e'],
    [-240,2400,1400,2640,'e'],[2200,2400,3840,2640,'e'],
    [-240,0,0,2640,'e'],[3600,-240,3840,2400,'e'],
    [3200,0,3600,400,'b']],
  wins:[[1050,-240,2550,0]],
  doors:[{name:'厨房门',rect:[1400,2400,2200,2640],h:[2200,2400],c:[-1,0],o:[0,-1],len:800,entry:true}],
  slides:[],
  rooms:[{id:'kitchen', name:'厨房', poly:R(0,0,3600,2400), mat:'antislip', at:[1800,1200]}],

const TEMPLATES = [
  {id:'yi',  name:'一字型', size:'3600 × 2100', make:TPL_I},
  {id:'ll',  name:'L 型',  size:'3200 × 2400', make:TPL_L},
  {id:'uu',  name:'U 型',  size:'3200 × 2050', make:TPL_U},

// 通用矩形户型生成器（自定义/改尺寸户型：顶墙居中窗 + 底墙居中门）
function genRectTpl(W, D){
  const winW = Math.max(600, Math.min(1500, W - 1200)), doorW = Math.min(800, W - 1400);
  const wx0 = (W - winW)/2, wx1 = (W + winW)/2, dx0 = (W - doorW)/2, dx1 = (W + doorW)/2;
  return {

// 墙体围合出的净内皮矩形（四边均有墙覆盖时返回 [ix0,iy0,ix1,iy1]，否则 null）
function autoRoomRect(){
  const xs = WALLS.flatMap(w => [w[0],w[2]]), ys = WALLS.flatMap(w => [w[1],w[3]]);
  const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
  const horiz = WALLS.filter(w => w[3]-w[1] <= w[2]-w[0]);   // 水平墙
  const vert  = WALLS.filter(w => w[3]-w[1] >  w[2]-w[0]);   // 垂直墙
  const coverH = yEdge => horiz.some(w => w[1] <= yEdge+1 && w[3] >= yEdge-1 && w[0] <= x0+300 && w[2] >= x1-300);
  const coverV = xEdge => vert.some(w => w[0] <= xEdge+1 && w[2] >= xEdge-1 && w[1] <= y0+300 && w[3] >= y1-300);
  if (!(coverH(y0) && coverH(y1) && coverV(x0) && coverV(x1))) return null;
  const th = e => (horiz.find(w => w[1] <= e+1 && w[3] >= e-1 && w[0] <= x0+300 && w[2] >= x1-300) || [0,0,0,0]);
  const tv = e => (vert.find(w => w[0] <= e+1 && w[2] >= e-1 && w[1] <= y0+300 && w[3] >= y1-300) || [0,0,0,0]);
  const t0 = th(y0), t1 = th(y1), l0 = tv(x0), r0 = tv(x1);
  const ix0 = Math.max(l0[0],l0[2]), ix1 = Math.min(r0[0],r0[2]), iy0 = Math.max(t0[1],t0[3]), iy1 = Math.min(t1[1],t1[3]);
  return (ix1-ix0 > 500 && iy1-iy0 > 500) ? [ix0, iy0, ix1, iy1] : null;
}
function applyLayout(){

  if (WALLS.length && !ROOMS.length){
    const rr = autoRoomRect();
    if (rr){
      ROOMS = [{id:'kitchen', name:tr('厨房','Kitchen'), poly:R(rr[0],rr[1],rr[2],rr[3]), mat:'antislip', at:[(rr[0]+rr[2])/2,(rr[1]+rr[3])/2]}];

/* ======================= 渲染 ======================= */
const NOLABEL = ['plant','floorlamp','sidetable','barstool','beanbag'];
function renderRooms(){
  let s = '';
  ROOMS.forEach(r => s += `<polygon class="room" data-room="${r.id}" points="${r.poly.map(p=>p.join(',')).join(' ')}" fill="url(#m-${state.rooms[r.id].mat})"/>`);
  const sill = ([a,b,c,d]) => `<rect x="${a}" y="${b}" width="${c-a}" height="${d-b}" fill="#e2dacb" stroke="#b9b0a0" stroke-width="1" vector-effect="non-scaling-stroke" pointer-events="none"/>`;
  DOORS.forEach(d => s += sill(d.rect)); SLIDES.forEach(d => s += sill(d.rect));
  $('#gRooms').innerHTML = s;
}

function renderFurn(){
  const g = $('#gFurn');
  g.setAttribute('display', ui.layers.furn ? 'inline' : 'none');
  g.innerHTML = state.furniture.map(f => {
    const fs = Math.max(80, Math.min(170, Math.min(f.w,f.d)*.2));
    const label = Math.min(f.w,f.d) >= 380 && !NOLABEL.includes(f.type)
      ? `<text transform="rotate(${-f.rot})" font-size="${fs}" text-anchor="middle" dominant-baseline="central" fill="#4a443c" opacity=".8" pointer-events="none">${esc(nm(f.name))}</text>` : '';
    return `<g class="furn" data-fid="${f.id}" transform="translate(${f.cx} ${f.cy}) rotate(${f.rot})">${furnSVG(f.type,f.w,f.d,f.color)}${label}</g>`;
  }).join('');
}

function renderWalls(){
  let h = WALLS.map((w,i) => {
    const [x0,y0,x1,y1,k] = w, id = 'w'+i, dem = state.demolished.includes(id);
    let fill = k==='b' ? (ui.layers.bearing ? '#b8412c' : '#26241f') : k==='low' ? '#e9e3d8' : k==='e' ? '#8f897d' : '#a7a195';
    let ex = k==='low' ? 'stroke="#8f897d" stroke-width="1" vector-effect="non-scaling-stroke"' : '';
    if (dem){ fill = 'rgba(198,91,58,.12)'; ex = 'stroke="#c65b3a" stroke-width="1.2" stroke-dasharray="5 3" vector-effect="non-scaling-stroke"'; }
    if (ui.wallSel === id) ex = 'stroke="#b5653a" stroke-width="3" stroke-dasharray="14 8" vector-effect="non-scaling-stroke"';
    return `<rect class="wall" data-wall="${id}" x="${x0}" y="${y0}" width="${x1-x0}" height="${y1-y0}" fill="${fill}" ${ex}/>`;
  }).join('');
  // 手绘墙预览（虚线框 + 长度标注）
  if (ui.tool === 'draw' && drag?.kind === 'draw' && drag.a && ui.drawCur){
    const r = drawWallRect(drag.a, ui.drawCur);
    if (r){
      const len = Math.round(Math.max(r[2]-r[0], r[3]-r[1]));
      h += `<rect x="${r[0]}" y="${r[1]}" width="${r[2]-r[0]}" height="${r[3]-r[1]}" fill="rgba(181,101,58,.15)" stroke="#b5653a" stroke-width="2" stroke-dasharray="10 6" vector-effect="non-scaling-stroke" pointer-events="none"/>
        <text x="${(r[0]+r[2])/2}" y="${(r[1]+r[3])/2}" font-size="150" text-anchor="middle" dominant-baseline="central" fill="#b5653a" pointer-events="none">${len}</text>`;
    }
  }
  $('#gWalls').innerHTML = h;
}
// 由起止点生成墙矩形：自动水平/垂直，厚 240，从起点沿拖拽方向生长
function drawWallRect(a, b){
  const T = 240;
  const dx = b[0]-a[0], dy = b[1]-a[1];
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 300) return null;
  if (Math.abs(dx) >= Math.abs(dy)) return [Math.min(a[0],b[0]), a[1], Math.max(a[0],b[0]), a[1]+T, 'n'];
  return [a[0], Math.min(a[1],b[1]), a[0]+T, Math.max(a[1],b[1]), 'n'];
}
/* ---------- 墙体平移与联动：墙上的门窗跟着走；矩形房间的地面随墙重算 ---------- */
function shiftWall(idx, dx, dy, done){
  const l = state.layout, w = l?.walls?.[idx]; if (!w || (!dx && !dy)) return;
  const ow = [w[0],w[1],w[2],w[3]];
  w[0]+=dx; w[2]+=dx; w[1]+=dy; w[3]+=dy;
  const hit = r => r[0] < ow[2]+1 && r[2] > ow[0]-1 && r[1] < ow[3]+1 && r[3] > ow[1]-1;
  const reg = o => { if (!done) return true; if (done.has(o)) return false; done.add(o); return true; };
  (l.wins || []).forEach(o => { if (reg(o) && hit(o)){ o[0]+=dx; o[1]+=dy; o[2]+=dx; o[3]+=dy; } });
  (l.doors || []).forEach(o => { if (reg(o) && hit(o.rect)){ o.rect[0]+=dx; o.rect[1]+=dy; o.rect[2]+=dx; o.rect[3]+=dy; o.h[0]+=dx; o.h[1]+=dy; } });
  (l.slides || []).forEach(o => { if (reg(o) && hit(o.rect)){ o.rect[0]+=dx; o.rect[1]+=dy; o.rect[2]+=dx; o.rect[3]+=dy; } });
}
/* 拖墙专用：平移单面墙；若它是全局边界墙，贴着它的相邻墙端点跟着延长/缩短，保持围合 */
function shiftWallEx(idx, dx, dy){
  const l = state.layout, w = l?.walls?.[idx]; if (!w || (!dx && !dy)) return;
  const vert = (w[3]-w[1]) > (w[2]-w[0]);
  const xs = l.walls.flatMap(q => [q[0],q[2]]), ys = l.walls.flatMap(q => [q[1],q[3]]);
  const bx0 = Math.min(...xs), bx1 = Math.max(...xs), by0 = Math.min(...ys), by1 = Math.max(...ys);
  const atEdge = vert
    ? (Math.min(w[0],w[2]) <= bx0+1 || Math.max(w[0],w[2]) >= bx1-1)
    : (Math.min(w[1],w[3]) <= by0+1 || Math.max(w[1],w[3]) >= by1-1);
  const lo = vert ? Math.min(w[0],w[2]) : Math.min(w[1],w[3]);
  const hi = vert ? Math.max(w[0],w[2]) : Math.max(w[1],w[3]);
  shiftWall(idx, dx, dy);
  if (!atEdge) return;
  l.walls.forEach((q,i) => {
    if (i === idx) return;
    const qv = (q[3]-q[1]) > (q[2]-q[0]);
    if (vert && !qv && dx){ if (q[2] >= lo-1 && q[2] <= hi+1) q[2] += dx; if (q[0] >= lo-1 && q[0] <= hi+1) q[0] += dx; }
    if (!vert && qv && dy){ if (q[3] >= lo-1 && q[3] <= hi+1) q[3] += dy; if (q[1] >= lo-1 && q[1] <= hi+1) q[1] += dy; }
  });
}
function syncRoomsToWalls(){
  const l = state.layout; if (!l?.rooms?.length || !l.walls?.length) return;
  const rr = autoRoomRect(); if (!rr) return;
  l.rooms.forEach(r => {
    const pl = r.poly || [];
    if (pl.length === 4 && new Set(pl.map(q => q[0])).size === 2 && new Set(pl.map(q => q[1])).size === 2){
      r.poly = R(rr[0],rr[1],rr[2],rr[3]); r.at = [(rr[0]+rr[2])/2, (rr[1]+rr[3])/2];
    }
  });
}
/* 标尺编辑整体改尺寸：把远侧边界墙（右侧 / 下侧，共线的多段一起）平移 delta */
function resizeLayout(axis, delta){
  const l = state.layout, ws = l?.walls || [];
  const dir = ws.map((w,i) => ({w, i, vert: (w[3]-w[1]) > (w[2]-w[0])})).filter(o => axis === 'x' ? o.vert : !o.vert);
  if (!dir.length) return false;
  const key = o => axis === 'x' ? (o.w[0]+o.w[2])/2 : (o.w[1]+o.w[3])/2;
  const mx = Math.max(...dir.map(key)), done = new Set();
  const far = dir.filter(o => Math.abs(key(o)-mx) <= 1);
  const lo = Math.min(...far.flatMap(o => axis === 'x' ? [o.w[0],o.w[2]] : [o.w[1],o.w[3]]));
  const hi = Math.max(...far.flatMap(o => axis === 'x' ? [o.w[0],o.w[2]] : [o.w[1],o.w[3]]));
  far.forEach(o => shiftWall(o.i, axis === 'x' ? delta : 0, axis === 'y' ? delta : 0, done));
  // 垂直方向的墙：端点贴着远侧墙的，跟着延长 / 缩短，保持围合
  ws.forEach(w => {
    const vert = (w[3]-w[1]) > (w[2]-w[0]);
    if (axis === 'x' && !vert){ if (w[2] >= lo-1 && w[2] <= hi+1) w[2] += delta; if (w[0] >= lo-1 && w[0] <= hi+1) w[0] += delta; }
    if (axis === 'y' && vert){ if (w[3] >= lo-1 && w[3] <= hi+1) w[3] += delta; if (w[1] >= lo-1 && w[1] <= hi+1) w[1] += delta; }
  });
  return true;
}
// 在选中的墙上开门洞 / 窗洞：洞口居中，墙体拆成两段，3D 里自动生成过梁与门窗
function addOpeningOnWall(idx, kind){
  const w = WALLS[idx]; if (!w || !state.layout) return;
  const horiz = (w[2]-w[0]) >= (w[3]-w[1]);
  const len = horiz ? w[2]-w[0] : w[3]-w[1];
  const olen = kind === 'door' ? 800 : kind === 'slide' ? 1500 : 1200;
  if (len < olen + 400) return toast(tr(`墙太短，需要至少 ${olen+400} mm`, `Wall too short — needs at least ${olen+400} mm`));
  // 室内方向：朝向当前户型包围盒中心
  const xs = WALLS.flatMap(v => [v[0],v[2]]), ys = WALLS.flatMap(v => [v[1],v[3]]);
  const bcx = (Math.min(...xs)+Math.max(...xs))/2, bcy = (Math.min(...ys)+Math.max(...ys))/2;
  ui.wallSel = null;
  mutate(() => {
    const ws = state.layout.walls, ow = ws[idx];
    const mid = horiz ? (ow[0]+ow[2])/2 : (ow[1]+ow[3])/2;
    const a = mid - olen/2, b = mid + olen/2, k = ow[4];
    const segs = horiz ? [[ow[0],ow[1],a,ow[3],k],[b,ow[1],ow[2],ow[3],k]] : [[ow[0],ow[1],ow[2],a,k],[ow[0],b,ow[2],ow[3],k]];
    ws.splice(idx, 1, ...segs.filter(s => Math.max(s[2]-s[0], s[3]-s[1]) >= 50));
    if (kind === 'win'){
      state.layout.wins.push(horiz ? [a, ow[1], b, ow[3]] : [ow[0], a, ow[2], b]);
    } else if (kind === 'slide'){
      state.layout.slides.push({rect: horiz ? [a, ow[1], b, ow[3]] : [ow[0], a, ow[2], b], v:false});
    } else {
      let rect, h, c, o;
      if (horiz){
        const inDown = (ow[1]+ow[3])/2 < bcy;              // 室内在墙的下方
        rect = [a, ow[1], b, ow[3]];
        h = [b, inDown ? ow[3] : ow[1]]; c = [-1,0]; o = inDown ? [0,1] : [0,-1];
      } else {
        const inRight = (ow[0]+ow[2])/2 < bcx;             // 室内在墙的右侧
        rect = [ow[0], a, ow[2], b];
        h = [inRight ? ow[2] : ow[0], b]; c = [0,-1]; o = inRight ? [1,0] : [-1,0];
      }
      state.layout.doors.push({name:tr('厨房门','Kitchen door'), rect, h, c, o, len:olen, entry:!DOORS.some(d => d.entry)});
    }
    state.demolished = [];
  });
  applyLayout();
  toast(kind === 'door' ? tr('已在墙上开门洞（800mm）', 'Door opening added (800mm)') : kind === 'slide' ? tr('已在墙上加推拉门（1500mm）', 'Sliding door added (1500mm)') : tr('已在墙上开窗（1200mm）', 'Window added (1200mm)'));
}

function renderOpenings(){
  const WS = 'stroke="#4f7394" stroke-width="1" vector-effect="non-scaling-stroke"';
  let s = '';
  WINS.forEach(([x0,y0,x1,y1]) => {
    const w = x1-x0, h = y1-y0;
    s += `<rect x="${x0}" y="${y0}" width="${w}" height="${h}" fill="#f7fbfd" ${WS}/>`;
    if (w >= h) [1/3,2/3].forEach(t => s += `<line x1="${x0}" y1="${y0+h*t}" x2="${x1}" y2="${y0+h*t}" ${WS}/>`);
    else [1/3,2/3].forEach(t => s += `<line x1="${x0+w*t}" y1="${y0}" x2="${x0+w*t}" y2="${y1}" ${WS}/>`);
  });
  const DS = 'stroke="#3d3a34" stroke-width="1" vector-effect="non-scaling-stroke"';
  DOORS.forEach(d => {
    const [hx,hy] = d.h, L = d.len, T = 40;
    const ox = hx + d.o[0]*L, oy = hy + d.o[1]*L, cx = hx + d.c[0]*L, cy = hy + d.c[1]*L;
    const sweep = d.o[0]*d.c[1] - d.o[1]*d.c[0] > 0 ? 1 : 0;
    const col = d.entry ? '#b5653a' : '#3d3a34';
    s += `<polygon points="${hx},${hy} ${ox},${oy} ${ox+d.c[0]*T},${oy+d.c[1]*T} ${hx+d.c[0]*T},${hy+d.c[1]*T}" fill="#fff" stroke="${col}" stroke-width="${d.entry?1.8:1}" vector-effect="non-scaling-stroke"/>`;
    s += `<path d="M${ox} ${oy}A${L} ${L} 0 0 ${sweep} ${cx} ${cy}" fill="none" ${DS} stroke-dasharray="5 3" opacity=".7"/>`;
  });
  SLIDES.forEach(({rect:[x0,y0,x1,y1],v}) => {
    if (v){ const L = y1-y0, m = (x0+x1)/2; s += `<rect x="${m-45}" y="${y0}" width="40" height="${L*.55}" fill="#fff" ${DS}/><rect x="${m+5}" y="${y1-L*.55}" width="40" height="${L*.55}" fill="#fff" ${DS}/>`; }
    else { const L = x1-x0, m = (y0+y1)/2; s += `<rect x="${x0}" y="${m-45}" width="${L*.55}" height="40" fill="#fff" ${DS}/><rect x="${x1-L*.55}" y="${m+5}" width="${L*.55}" height="40" fill="#fff" ${DS}/>`; }
  });
  // 入户标识（位置随入户门动态计算）
  const entry = DOORS.find(d => d.entry);
  if (entry){
    const ex = entry.h[0] + entry.c[0]*entry.len/2, ey = entry.h[1] + entry.c[1]*entry.len/2;  // 洞口中心
    const bx = ex - entry.o[0]*680, by = ey - entry.o[1]*680;                                 // 门外侧基点
    const tx = ex - entry.o[0]*180, ty = ey - entry.o[1]*180;                                 // 箭头指向洞口
    const nx = -entry.o[1], ny = entry.o[0];                                                  // 法向（箭翼）
    const hx = ex - entry.o[0]*300, hy = ey - entry.o[1]*300;
    s += `<path d="M${bx} ${by}L${tx} ${ty}M${hx+nx*120} ${hy+ny*120}L${tx} ${ty}L${hx-nx*120} ${hy-ny*120}" fill="none" stroke="#b5653a" stroke-width="2" vector-effect="non-scaling-stroke"/>
          <text x="${bx - entry.o[0]*180 + nx*220}" y="${by - entry.o[1]*180 + ny*220}" font-size="200" fill="#b5653a">${tr('入户','Entry')}</text>`;
  }
  // 透明热区：门窗可选中 / 可拖动（本层在墙体之上，点洞口优先命中）
  WINS.forEach((o,i) => { s += `<rect data-op="w${i}" x="${o[0]-60}" y="${o[1]-60}" width="${o[2]-o[0]+120}" height="${o[3]-o[1]+120}" fill="transparent"/>`; });
  DOORS.forEach((d,i) => { const r = d.rect; s += `<rect data-op="d${i}" x="${r[0]-60}" y="${r[1]-60}" width="${r[2]-r[0]+120}" height="${r[3]-r[1]+120}" fill="transparent"/>`; });
  SLIDES.forEach((o,i) => { const r = o.rect; s += `<rect data-op="s${i}" x="${r[0]-60}" y="${r[1]-60}" width="${r[2]-r[0]+120}" height="${r[3]-r[1]+120}" fill="transparent"/>`; });
  $('#gOpen').innerHTML = s;
}

function renderDims(){
  const DC = '#7d7160', LS = `stroke="${DC}" stroke-width="1" vector-effect="non-scaling-stroke"`, TK = `stroke="${DC}" stroke-width="2" vector-effect="non-scaling-stroke"`;
  const txt = (x,y,v,rot,dim) => `<text x="${x}" y="${y}" font-size="${v<400?140:200}" text-anchor="middle" fill="${DC}"${dim?` data-dim="${dim}"`:''} ${rot?`transform="rotate(-90 ${x} ${y})"`:''}>${v}</text>`;
  const chain = (horiz, at, start, segs, dim) => {
    const pts = [start]; segs.forEach(v => pts.push(pts[pts.length-1]+v));
    let s = horiz ? `<line x1="${pts[0]}" y1="${at}" x2="${pts.at(-1)}" y2="${at}" ${LS}/>` : `<line x1="${at}" y1="${pts[0]}" x2="${at}" y2="${pts.at(-1)}" ${LS}/>`;
    pts.forEach(p => s += horiz
      ? `<line x1="${p}" y1="${at-170}" x2="${p}" y2="${at+170}" ${LS}/><line x1="${p-80}" y1="${at+80}" x2="${p+80}" y2="${at-80}" ${TK}/>`
      : `<line x1="${at-170}" y1="${p}" x2="${at+170}" y2="${p}" ${LS}/><line x1="${at-80}" y1="${p+80}" x2="${at+80}" y2="${p-80}" ${TK}/>`);
    segs.forEach((v,i) => { const mid = (pts[i]+pts[i+1])/2; s += horiz ? txt(mid, at-70, v, false, dim) : txt(at-70, mid, v, true, dim); });
    return s;
  };
  const g = $('#gDims');
  g.setAttribute('display', ui.layers.dims ? 'inline' : 'none');
  if (!WALLS.length && !ROOMS.length){ g.innerHTML = ''; return; }
  // 按当前户型动态生成：总宽 / 总深链 + 顶边（窗）与底边（门）的分段链
  const pts = [];
  WALLS.forEach(w => pts.push([w[0],w[1]],[w[2],w[3]]));
  WINS.forEach(w => pts.push([w[0],w[1]],[w[2],w[3]]));
  DOORS.forEach(d => pts.push([d.rect[0],d.rect[1]],[d.rect[2],d.rect[3]]));
  ROOMS.forEach(r => r.poly.forEach(p => pts.push(p)));
  const xs = pts.map(p=>p[0]), ys = pts.map(p=>p[1]);
  const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
  // 净内皮范围（用于分段链的起止）
  let ix0 = x0, ix1 = x1, iy0 = y0, iy1 = y1;
  if (ROOMS.length){
    const rp = ROOMS[0].poly.map(p=>p[0]), rq = ROOMS[0].poly.map(p=>p[1]);
    ix0 = Math.min(...rp); ix1 = Math.max(...rp); iy0 = Math.min(...rq); iy1 = Math.max(...rq);
  }
  ui._dimBox = {ix0, ix1, iy0, iy1};
  // 与某条水平净边（y = edge，墙体厚度向外 260 范围内）相交的水平洞口 → 分段序列
  const segsAt = edge => {
    const ops = [];
    const band = r => r[1] <= edge + 260 && r[3] >= edge - 260 && (r[2]-r[0]) > (r[3]-r[1]);
    WINS.forEach(w => { if (band(w)) ops.push([w[0], w[2]]); });
    DOORS.forEach(d => { if (band(d.rect)) ops.push([d.rect[0], d.rect[2]]); });
    ops.sort((a,b) => a[0]-b[0]);
    const segs = []; let cur = ix0;
    ops.forEach(([a,b]) => { if (a > cur) segs.push(a-cur); segs.push(b-a); cur = b; });
    if (ix1 > cur) segs.push(ix1-cur);
    return segs.filter(v => v > 0);
  };
  let s = chain(true, y0-410, ix0, [Math.round(ix1-ix0)], 'W') + chain(false, x0-410, iy0, [Math.round(iy1-iy0)], 'D') + chain(false, x1+150, iy0, [Math.round(iy1-iy0)], 'D');
  const topSegs = segsAt(iy0), botSegs = segsAt(iy1);
  if (topSegs.length > 1) s += chain(true, y0-140, ix0, topSegs);
  if (botSegs.length > 1) s += chain(true, y1+400, ix0, botSegs);
  // 每面墙（墙段）中心直接标长度，双击改数
  s += WALLS.map((w,i) => {
    const horiz = (w[2]-w[0]) >= (w[3]-w[1]);
    const len = Math.round(horiz ? w[2]-w[0] : w[3]-w[1]);
    if (len < 400) return '';
    const mx = (w[0]+w[2])/2, my = (w[1]+w[3])/2;
    return `<text x="${mx}" y="${my}" font-size="130" text-anchor="middle" dominant-baseline="central" fill="#57534a" data-wlen="${i}" stroke="#fffdf9" stroke-width="6" paint-order="stroke"${horiz ? '' : ` transform="rotate(-90 ${mx} ${my})"`}>${len}</text>`;
  }).join('');
  g.innerHTML = s;
}

/* ---------- 标尺数字点击编辑：点总宽 / 总深 → 输入新值 → 远侧墙整体外扩 / 内收 ---------- */
/* 画布内联数字输入浮层：Enter/blur 提交，Esc 取消 */
function openNumInput(cur, cx, cy, min, cb){
  const old = $('#dimEdit'); if (old){ old.blur(); old.remove(); }
  const inp = document.createElement('input');
  inp.id = 'dimEdit'; inp.type = 'number'; inp.value = cur; inp.step = 50; inp.min = min;
  inp.style.left = cx + 'px'; inp.style.top = cy + 'px';
  document.body.appendChild(inp);
  inp.focus(); inp.select();
  let done = false;
  const ok = () => {
    if (done) return; done = true;
    const v = Math.round(parseFloat(inp.value)); inp.remove();
    if (!isNaN(v) && v >= min && v !== cur) cb(v);
  };
  inp.onkeydown = e => { e.stopPropagation(); if (e.key === 'Enter') ok(); if (e.key === 'Escape'){ done = true; inp.remove(); } };
  inp.onblur = ok;
}
function editDim(axis, cx, cy){
  const b = ui._dimBox; if (!b) return;
  const cur = Math.round(axis === 'x' ? b.ix1 - b.ix0 : b.iy1 - b.iy0);
  openNumInput(cur, cx, cy, 600, v => {
    mutate(() => { resizeLayout(axis, v - cur); syncRoomsToWalls(); });
    toast(tr(`净${axis === 'x' ? '宽' : '深'}已改为 ${v} mm（${v > cur ? '外扩' : '内收'} ${Math.abs(v - cur)}）`, `Net ${axis === 'x' ? 'width' : 'depth'} set to ${v} mm (${v > cur ? '+' : '−'}${Math.abs(v - cur)})`));
  });
}
/* 轻点墙长标注改墙长：以墙中心向两端伸缩 */
function editWallLen(idx, cx, cy){
  const w = WALLS[idx]; if (!w) return;
  const horiz = (w[2]-w[0]) >= (w[3]-w[1]);
  const cur = Math.round(horiz ? w[2]-w[0] : w[3]-w[1]);
  openNumInput(cur, cx, cy, 300, v => {
    mutate(() => {
      const ww = state.layout.walls[idx]; if (!ww) return;
      if (horiz){ const c = (ww[0]+ww[2])/2; ww[0] = Math.round(c-v/2); ww[2] = Math.round(c+v/2); }
      else { const c = (ww[1]+ww[3])/2; ww[1] = Math.round(c-v/2); ww[3] = Math.round(c+v/2); }
      syncRoomsToWalls();
    });
    toast(tr(`墙长已改为 ${v} mm（以中心向两端伸缩）`, `Wall length set to ${v} mm (centered)`));
  });
}

/* ---------- 门窗：选中、拖动、改宽、翻转、删除 ---------- */
const parseOp = id => ({t: id[0] === 'w' ? 'win' : id[0] === 'd' ? 'door' : 'slide', i: +id.slice(1)});
function getOp(os){
  const l = state.layout; if (!l || !os) return null;
  if (os.t === 'win'  && l.wins[os.i])   return {rect: l.wins[os.i], kind: 'win'};
  if (os.t === 'door' && l.doors[os.i])  return {rect: l.doors[os.i].rect, kind: 'door', door: l.doors[os.i]};
  if (os.t === 'slide' && l.slides[os.i]) return {rect: l.slides[os.i].rect, kind: 'slide'};
  return null;
}
/* 洞口两侧紧邻的墙段（端点贴着洞口边缘 ±2mm） */
function opNeighbors(r, horiz){
  let A = null, B = null;
  (state.layout?.walls || []).forEach(w => {
    const h2 = (w[2]-w[0]) >= (w[3]-w[1]);
    if (h2 !== horiz) return;
    if (horiz){
      if (w[1] > r[3]-1 || w[3] < r[1]+1) return;
      if (Math.abs(w[2]-r[0]) <= 2) A = w;
      if (Math.abs(w[0]-r[2]) <= 2) B = w;
    } else {
      if (w[0] > r[2]-1 || w[2] < r[0]+1) return;
      if (Math.abs(w[3]-r[1]) <= 2) A = w;
      if (Math.abs(w[1]-r[3]) <= 2) B = w;
    }
  });
  return {A, B};
}
/* 门窗沿墙拖动的可动范围（洞中心坐标） */
function opRange(os, op){
  const r = op.rect, horiz = (r[2]-r[0]) >= (r[3]-r[1]);
  const W = horiz ? r[2]-r[0] : r[3]-r[1];
  const {A, B} = opNeighbors(r, horiz);
  const lo = A ? (horiz ? A[0] : A[1]) + 80 + W/2 : -Infinity;
  const hi = B ? (horiz ? B[2] : B[3]) - 80 - W/2 : Infinity;
  return [lo, hi];
}
/* 改门窗宽度：门保持铰链端不动，窗/推拉门中心对称；两侧墙段自动收放 */
function resizeOpening(os, newW){
  const l = state.layout, op = getOp(os); if (!l || !op) return;
  const r = op.rect, horiz = (r[2]-r[0]) >= (r[3]-r[1]);
  const oldW = Math.round(horiz ? r[2]-r[0] : r[3]-r[1]);
  newW = Math.max(400, Math.round(newW));
  let d = newW - oldW; if (!d) return;
  const {A, B} = opNeighbors(r, horiz);
  if (d > 0){
    const capA = A ? (horiz ? A[2]-A[0] : A[3]-A[1]) - 80 : Infinity;
    const capB = B ? (horiz ? B[2]-B[0] : B[3]-B[1]) - 80 : Infinity;
    const maxD = 2 * Math.max(0, Math.min(capA, capB));
    if (d > maxD){ d = maxD; newW = oldW + d; if (!d) return; }
  }
  mutate(() => {
    if (os.t === 'door'){
      const dr = l.doors[os.i];
      const hingeAtStart = horiz ? Math.abs(dr.h[0]-r[0]) <= Math.abs(dr.h[0]-r[2]) : Math.abs(dr.h[1]-r[1]) <= Math.abs(dr.h[1]-r[3]);
      if (horiz){ if (hingeAtStart){ r[2] += d; if (B) B[0] += d; } else { r[0] -= d; if (A) A[2] -= d; } }
      else { if (hingeAtStart){ r[3] += d; if (B) B[1] += d; } else { r[1] -= d; if (A) A[3] -= d; } }
      dr.len = newW;
    } else {
      const h = d / 2;
      if (horiz){ r[0] -= h; r[2] += h; if (A) A[2] -= h; if (B) B[0] += h; }
      else { r[1] -= h; r[3] += h; if (A) A[3] -= h; if (B) B[1] += h; }
    }
  });
}
/* 门翻转：out = 内外换向；hinge = 铰链换到另一侧 */
function flipOpening(i, mode){
  const d = state.layout?.doors?.[i]; if (!d) return;
  if (mode === 'out'){ d.o = [-d.o[0], -d.o[1]]; }
  else { d.h = [d.h[0] + d.o[0]*d.len, d.h[1] + d.o[1]*d.len]; d.o = [-d.o[0], -d.o[1]]; }
}
function deleteOpening(){
  const os = ui.opSel; if (!os) return;
  ui.opSel = null;
  mutate(() => {
    const l = state.layout;
    if (os.t === 'win') l.wins.splice(os.i, 1);
    else if (os.t === 'door') l.doors.splice(os.i, 1);
    else l.slides.splice(os.i, 1);
  });
  toast(tr('已删除（墙上洞口保留，墙段可用「选择」工具逐段删除）', 'Deleted — the wall gap remains; remove wall segments with Select if needed'));
}
/* 墙厚：中心线不动，两侧改；门窗厚度方向跟随对齐 */
function setWallThick(idx, t){
  const l = state.layout, w = l?.walls?.[idx]; if (!w) return;
  const horiz = (w[2]-w[0]) >= (w[3]-w[1]);
  const ow = [w[0],w[1],w[2],w[3]];
  if (horiz){ const cy = (w[1]+w[3])/2; w[1] = Math.round(cy-t/2); w[3] = Math.round(cy+t/2); }
  else { const cx = (w[0]+w[2])/2; w[0] = Math.round(cx-t/2); w[2] = Math.round(cx+t/2); }
  const hit = r => r[0] < ow[2]+1 && r[2] > ow[0]-1 && r[1] < ow[3]+1 && r[3] > ow[1]-1;
  (l.wins || []).forEach(o => { if (hit(o)){ if (horiz){ o[1] = w[1]; o[3] = w[3]; } else { o[0] = w[0]; o[2] = w[2]; } } });
  (l.doors || []).forEach(o => { if (hit(o.rect)){
    if (horiz){ const top = Math.abs(o.h[1]-ow[1]) < Math.abs(o.h[1]-ow[3]); o.rect[1] = w[1]; o.rect[3] = w[3]; o.h[1] = top ? w[1] : w[3]; }
    else { const left = Math.abs(o.h[0]-ow[0]) < Math.abs(o.h[0]-ow[2]); o.rect[0] = w[0]; o.rect[2] = w[2]; o.h[0] = left ? w[0] : w[2]; }
  } });
  (l.slides || []).forEach(o => { if (hit(o.rect)){ if (horiz){ o.rect[1] = w[1]; o.rect[3] = w[3]; } else { o.rect[0] = w[0]; o.rect[2] = w[2]; } } });
}
/* 墙绕中心旋转 90°×times，墙上门窗一起转 */
function rotateWall90(idx, times){
  const l = state.layout, w = l?.walls?.[idx]; if (!w) return;
  times = ((Math.round(times) % 4) + 4) % 4;
  for (let n = 0; n < times; n++){
    const cx = (w[0]+w[2])/2, cy = (w[1]+w[3])/2;
    const hw = (w[2]-w[0])/2, hh = (w[3]-w[1])/2;
    const ow = [w[0],w[1],w[2],w[3]];
    w[0] = cx-hh; w[1] = cy-hw; w[2] = cx+hh; w[3] = cy+hw;
    const rotP = (x,y) => [cx-(y-cy), cy+(x-cx)];
    const rotV = v => [-v[1], v[0]];
    const hit = r => r[0] < ow[2]+1 && r[2] > ow[0]-1 && r[1] < ow[3]+1 && r[3] > ow[1]-1;
    const rotRect = r => { const [ax,ay] = rotP(r[0],r[1]), [bx,by] = rotP(r[2],r[3]);
      r[0] = Math.min(ax,bx); r[1] = Math.min(ay,by); r[2] = Math.max(ax,bx); r[3] = Math.max(ay,by); };
    (l.wins || []).forEach(o => { if (hit(o)) rotRect(o); });
    (l.doors || []).forEach(o => { if (hit(o.rect)){ rotRect(o.rect); const nh = rotP(o.h[0], o.h[1]); o.h[0] = nh[0]; o.h[1] = nh[1]; o.c = rotV(o.c); o.o = rotV(o.o); } });
    (l.slides || []).forEach(o => { if (hit(o.rect)){ rotRect(o.rect); o.v = !o.v; } });
  }
}
/* 找离 (x,y) 最近的墙（tol 内），返回 {idx, pos=沿墙坐标} */
function nearWall(x, y, tol){
  let best = null;
  WALLS.forEach((w, i) => {
    const cx = Math.max(w[0], Math.min(w[2], x)), cy = Math.max(w[1], Math.min(w[3], y));
    const dd = Math.hypot(x-cx, y-cy);
    if (dd <= tol && (!best || dd < best.dd)) best = {idx:i, dd, pos: (w[2]-w[0]) >= (w[3]-w[1]) ? cx : cy};
  });
  return best;
}
/* 在墙 idx 的沿墙坐标 pos 处开 kind（win/door/slide）洞口，olen 为洞口宽 */
function addOpeningAt(idx, kind, pos, olen){
  const w = WALLS[idx]; if (!w || !state.layout) return false;
  const l = state.layout;
  const horiz = (w[2]-w[0]) >= (w[3]-w[1]);
  const len = horiz ? w[2]-w[0] : w[3]-w[1];
  olen = Math.round(olen || (kind === 'door' ? 800 : kind === 'slide' ? 1500 : 1200));
  if (len < olen + 160){ toast(tr(`墙太短，需要至少 ${olen+160} mm`, `Wall too short — needs at least ${olen+160} mm`)); return false; }
  const w0 = horiz ? w[0] : w[1], w1 = horiz ? w[2] : w[3];
  pos = Math.max(w0 + olen/2 + 80, Math.min(w1 - olen/2 - 80, pos));
  const a = Math.round(pos - olen/2), b = Math.round(pos + olen/2);
  const onW = r => r[0] < w[2]+1 && r[2] > w[0]-1 && r[1] < w[3]+1 && r[3] > w[1]-1;
  const ovl = (x0, x1) => x0 < b && x1 > a;
  const dup = (l.wins||[]).some(o => onW(o) && ovl(horiz?o[0]:o[1], horiz?o[2]:o[3]))
    || (l.doors||[]).some(o => onW(o.rect) && ovl(horiz?o.rect[0]:o.rect[1], horiz?o.rect[2]:o.rect[3]))
    || (l.slides||[]).some(o => onW(o.rect) && ovl(horiz?o.rect[0]:o.rect[1], horiz?o.rect[2]:o.rect[3]));
  if (dup){ toast(tr('该位置已有门窗', 'Opening already exists here')); return false; }
  const xs = WALLS.flatMap(v => [v[0],v[2]]), ys = WALLS.flatMap(v => [v[1],v[3]]);
  const bcx = (Math.min(...xs)+Math.max(...xs))/2, bcy = (Math.min(...ys)+Math.max(...ys))/2;
  mutate(() => {
    const ws = l.walls, ow = ws[idx];
    const k = ow[4];
    const segs = horiz ? [[ow[0],ow[1],a,ow[3],k],[b,ow[1],ow[2],ow[3],k]] : [[ow[0],ow[1],ow[2],a,k],[ow[0],b,ow[2],ow[3],k]];
    ws.splice(idx, 1, ...segs.filter(sg => Math.max(sg[2]-sg[0], sg[3]-sg[1]) >= 50));
    if (kind === 'win') l.wins.push(horiz ? [a, ow[1], b, ow[3]] : [ow[0], a, ow[2], b]);
    else if (kind === 'slide') l.slides.push({rect: horiz ? [a, ow[1], b, ow[3]] : [ow[0], a, ow[2], b], v:false});
    else {
      let rect, h, c, o;
      if (horiz){
        const inDown = (ow[1]+ow[3])/2 < bcy;
        rect = [a, ow[1], b, ow[3]];
        h = [b, inDown ? ow[3] : ow[1]]; c = [-1,0]; o = inDown ? [0,1] : [0,-1];
      } else {
        const inRight = (ow[0]+ow[2])/2 < bcx;
        rect = [ow[0], a, ow[2], b];
        h = [inRight ? ow[2] : ow[0], b]; c = [0,-1]; o = inRight ? [1,0] : [-1,0];
      }
      l.doors.push({name:tr('厨房门','Kitchen door'), rect, h, c, o, len:olen, entry:!l.doors.some(dd => dd.entry)});
    }
    state.demolished = [];
  });
  applyLayout();
  toast(tr('已添加，选中后可拖动位置、改宽度', 'Added — drag it or resize in the panel'));
  return true;
}
/* 墙整体平移（含门窗跟随），端点贴着它的垂直方向墙端点一并跟随——不限边界墙 */
function shiftConnected(idx, dx, dy, skip){
  const l = state.layout, w = l?.walls?.[idx]; if (!w || (!dx && !dy)) return;
  const vert = (w[3]-w[1]) > (w[2]-w[0]);
  const lo = vert ? Math.min(w[0],w[2]) : Math.min(w[1],w[3]);
  const hi = vert ? Math.max(w[0],w[2]) : Math.max(w[1],w[3]);
  shiftWall(idx, dx, dy);
  l.walls.forEach((q,i) => {
    if (i === idx || i === skip) return;
    const qv = (q[3]-q[1]) > (q[2]-q[0]);
    if (vert && !qv && dx){ if (q[2] >= lo-1 && q[2] <= hi+1) q[2] += dx; if (q[0] >= lo-1 && q[0] <= hi+1) q[0] += dx; }
    if (!vert && qv && dy){ if (q[3] >= lo-1 && q[3] <= hi+1) q[3] += dy; if (q[1] >= lo-1 && q[1] <= hi+1) q[1] += dy; }
  });
}
/* 双轴拖墙：法线分量走边界联动（shiftWallEx），轴向分量让两端相接的垂直方向墙整体跟随 */
function shiftWallAxial(idx, dx, dy){
  const l = state.layout, w = l?.walls?.[idx]; if (!w || (!dx && !dy)) return;
  const vert = (w[3]-w[1]) > (w[2]-w[0]);
  const nd = vert ? dx : dy, ad = vert ? dy : dx;
  let follow = [];
  if (ad){
    const e0 = vert ? Math.min(w[1],w[3]) : Math.min(w[0],w[2]);
    const e1 = vert ? Math.max(w[1],w[3]) : Math.max(w[0],w[2]);
    const nLo = vert ? Math.min(w[0],w[2]) : Math.min(w[1],w[3]);
    const nHi = vert ? Math.max(w[0],w[2]) : Math.max(w[1],w[3]);
    l.walls.forEach((q,i) => {
      if (i === idx) return;
      const qv = (q[3]-q[1]) > (q[2]-q[0]);
      if (qv === vert) return;
      const a0 = qv ? Math.min(q[0],q[2]) : Math.min(q[1],q[3]);
      const a1 = qv ? Math.max(q[0],q[2]) : Math.max(q[1],q[3]);
      const s0 = qv ? Math.min(q[1],q[3]) : Math.min(q[0],q[2]);
      const s1 = qv ? Math.max(q[1],q[3]) : Math.max(q[0],q[2]);
      const endTouch = (e0 >= a0-1 && e0 <= a1+1) || (e1 >= a0-1 && e1 <= a1+1);
      const overlap = s0 <= nHi+1 && s1 >= nLo-1;
      if (endTouch && overlap) follow.push(i);
    });
  }
  if (nd) shiftWallEx(idx, vert ? nd : 0, vert ? 0 : nd);
  if (ad){
    follow.forEach(i => shiftConnected(i, vert ? 0 : ad, vert ? ad : 0, idx));
    shiftWall(idx, vert ? 0 : ad, vert ? ad : 0);
  }
}
/* 画墙完成后弹出：长度 + 厚度一次输完 */
function editNewWall(idx, cx, cy){
  const w = WALLS[idx]; if (!w) return;
  const horiz = (w[2]-w[0]) >= (w[3]-w[1]);
  const curL = Math.round(horiz ? w[2]-w[0] : w[3]-w[1]);
  const curT = Math.round(horiz ? w[3]-w[1] : w[2]-w[0]);
  const old = $('#dimEdit'); if (old){ old.blur(); old.remove(); }
  const box = document.createElement('div'); box.id = 'dimEdit'; box.className = 'wallSpec';
  box.style.left = Math.max(150, Math.min(innerWidth-150, cx)) + 'px';
  box.style.top = Math.max(50, cy-60) + 'px';
  box.innerHTML = `<label>${tr('长度','Len')} <input id="wsL" type="number" value="${curL}" step="50" min="300"></label><label>${tr('厚度','Thk')} <input id="wsT" type="number" value="${curT}" step="20" min="60" max="480"></label><button id="wsOk">${tr('确定','OK')}</button>`;
  document.body.appendChild(box);
  const li = $('#wsL'), ti = $('#wsT');
  li.focus(); li.select();
  let done = false;
  const ok = () => {
    if (done) return; done = true;
    const nl = Math.round(parseFloat(li.value)), nt = Math.round(parseFloat(ti.value));
    box.remove();
    const doL = !isNaN(nl) && nl >= 300 && nl !== curL;
    const doT = !isNaN(nt) && nt >= 60 && nt <= 480 && nt !== curT;
    if (doL || doT) mutate(() => {
      const ww = state.layout.walls[idx]; if (!ww) return;
      if (doL){
        if (horiz){ const c = (ww[0]+ww[2])/2; ww[0] = Math.round(c-nl/2); ww[2] = Math.round(c+nl/2); }
        else { const c = (ww[1]+ww[3])/2; ww[1] = Math.round(c-nl/2); ww[3] = Math.round(c+nl/2); }
      }
      if (doT) setWallThick(idx, nt);
      syncRoomsToWalls();
    });
  };
  $('#wsOk').onclick = ok;
  box.onkeydown = e => { e.stopPropagation(); if (e.key === 'Enter') ok(); if (e.key === 'Escape'){ done = true; box.remove(); } };
}

function renderMeasure(){
  const k = 1/view.s, fs = 12*k;
  const one = (a,b,tmp) => {
    const L = Math.hypot(b.x-a.x, b.y-a.y); if (L < 1) return '';
    let ang = Math.atan2(b.y-a.y, b.x-a.x)*180/Math.PI; if (ang > 90 || ang < -90) ang += 180;
    const mx = (a.x+b.x)/2, my = (a.y+b.y)/2, nx = -(b.y-a.y)/L*5*k, ny = (b.x-a.x)/L*5*k;
    const col = tmp ? '#2f5d62' : '#b5653a', S = `stroke="${col}" stroke-width="1.5" vector-effect="non-scaling-stroke"`;
    return `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" ${S}/>
      <line x1="${a.x-nx}" y1="${a.y-ny}" x2="${a.x+nx}" y2="${a.y+ny}" ${S}/><line x1="${b.x-nx}" y1="${b.y-ny}" x2="${b.x+nx}" y2="${b.y+ny}" ${S}/>
      <text x="${mx}" y="${my-5*k}" font-size="${fs}" text-anchor="middle" fill="${col}" font-weight="600" transform="rotate(${ang} ${mx} ${my})"
        stroke="#fff" stroke-width="${3.5*k}" paint-order="stroke">${Math.round(L)} mm</text>`;
  };
  let s = state.measures.map(m => one(m.a,m.b)).join('');
  if (ui.mA && ui.mCur) s += one(ui.mA, ui.mCur, true);
  if (ui.mA) s += `<circle cx="${ui.mA.x}" cy="${ui.mA.y}" r="${3*k}" fill="#2f5d62"/>`;
  $('#gMeasure').innerHTML = s;
}

const PANES = 'huxing-panes';
const panes = (() => { try { return JSON.parse(localStorage.getItem(PANES)) || {}; } catch(e) { return {}; } })();
function drawer(which, open){
  const app = $('.app'), els = {lib:$('aside.lib'), panel:$('aside.right')}, n = narrow();
  if (n){
    Object.entries(els).forEach(([k, el]) => el.classList.toggle('open', k === which && (open ?? !el.classList.contains('open'))));
  } else {
    Object.values(els).forEach(el => el.classList.remove('open'));
    if (which){
      const k = which === 'lib' ? 'hideLib' : 'hidePanel';
      panes[k] = open === undefined ? !panes[k] : !open;
      try { localStorage.setItem(PANES, JSON.stringify(panes)); } catch(e) {}
    }
  }
  app.classList.toggle('hide-lib', !!panes.hideLib); app.classList.toggle('hide-panel', !!panes.hidePanel);
  syncPaneBtns();
}
function syncPaneBtns(){
  const els = {lib:$('aside.lib'), panel:$('aside.right')}, n = narrow();

/* ======================= 操作 ======================= */
function select(sel){ ui.sel = sel; renderSel(); renderPanel(); }
function rotateSel(d){ if (ui.sel?.kind==='furn') mutate(() => { const f = getF(ui.sel.id); f.rot = norm(f.rot + d); }); }
function deleteSel(){
  if (ui.opSel){ deleteOpening(); return; }
  if (ui.sel?.kind==='furn'){ const id = ui.sel.id; ui.sel = null; mutate(() => state.furniture = state.furniture.filter(f => f.id !== id)); return; }
  if (ui.wallSel){
    const idx = +ui.wallSel.slice(1); ui.wallSel = null;
    mutate(() => { state.layout.walls.splice(idx, 1); state.demolished = []; });
    applyLayout(); toast(tr('已删除墙体', 'Wall deleted'));
  }
}
function duplicateSel(){
  if (ui.sel?.kind !== 'furn') return;
  const f = getF(ui.sel.id), n = {...f, id:uid(), cx:f.cx+200, cy:f.cy+200};
  ui.sel = {kind:'furn', id:n.id}; mutate(() => state.furniture.push(n));
}
// 新放下的家具若压在墙 / 窗上，沿穿透较浅的方向推出来，刚好贴墙
function pushOut(f){
  for (let n = 0; n < 4; n++){
    let moved = false;
    for (const r of snapRects()){
      const {hw, hh} = aabb(f), ox = Math.min(f.cx+hw, r[2]) - Math.max(f.cx-hw, r[0]), oy = Math.min(f.cy+hh, r[3]) - Math.max(f.cy-hh, r[1]);
      if (ox <= 0 || oy <= 0) continue;
      if (ox < oy) f.cx = f.cx < (r[0]+r[2])/2 ? r[0]-hw : r[2]+hw;
      else f.cy = f.cy < (r[1]+r[3])/2 ? r[1]-hh : r[3]+hh;
      moved = true;
    }
    if (!moved) return;
  }
}
function addItem(it, x, y){
  const [type,name,w,d,color] = it, f = F(type,name,Math.round(x/10)*10,Math.round(y/10)*10,w,d,0,color);
  pushOut(f);
  ui.sel = {kind:'furn', id:f.id};
  mutate(() => type==='rug' ? state.furniture.unshift(f) : state.furniture.push(f));
  toast(tr(`已添加「${name}」${w}×${d}`, `Added "${nm(name)}" ${w}×${d}`));
}
function toggleWall(id){
  const w = WALLS[+id.slice(1)];
  if (w[4]==='b') return toast(tr('承重墙（黑色）不可拆除', 'Load-bearing walls (black) cannot be removed'));
  if (w[4]==='e') return toast(tr('外墙属于建筑外围护结构，不建议拆除', 'Exterior walls are part of the building envelope and should not be removed'));
  const on = state.demolished.includes(id);
  mutate(() => state.demolished = on ? state.demolished.filter(x => x!==id) : [...state.demolished, id]);
  toast(on ? tr('已恢复墙体', 'Wall restored') : tr(`已标记拆除 ${Math.max(w[2]-w[0], w[3]-w[1])} mm 墙体`, `Marked ${Math.max(w[2]-w[0], w[3]-w[1])} mm of wall for removal`));
}

function syncModeHint(){

    demolish:tr('点击灰色非承重墙标记拆除，再次点击恢复 · 黑色承重墙不可拆', 'Click a grey non-bearing wall to remove it, click again to restore · black bearing walls cannot be removed')};

/* ======================= 视图 ======================= */
function applyView(){
  const W = svg.clientWidth, H = svg.clientHeight;
  svg.setAttribute('viewBox', `${view.x0} ${view.y0} ${W/view.s} ${H/view.s}`);
  const ratio = 1/(view.s*PX_MM);
  $('#ratio').textContent = '1:' + Math.round(ratio);
  const nice = [100,200,500,1000,2000,5000].find(v => v*view.s >= 60) || 5000;
  $('#sbBar').style.width = nice*view.s + 'px';
  $('#sbText').textContent = nice >= 1000 ? `${nice/1000} m` : `${nice} mm`;
  renderSel(); renderMeasure();
}
function fitView(){
  const W = svg.clientWidth, H = svg.clientHeight;
  view.s = Math.min(W/BOUNDS.w, H/BOUNDS.h);
  view.x0 = BOUNDS.x - (W/view.s - BOUNDS.w)/2; view.y0 = BOUNDS.y - (H/view.s - BOUNDS.h)/2;
  applyView();
}
function zoomAt(ns, mx, my){
  ns = Math.max(.012, Math.min(2, ns));
  const px = view.x0 + mx/view.s, py = view.y0 + my/view.s;
  view.s = ns; view.x0 = px - mx/ns; view.y0 = py - my/ns; applyView();
}
const zoomCenter = k => zoomAt(view.s*k, svg.clientWidth/2, svg.clientHeight/2);
const setRatio = r => zoomAt(1/(r*PX_MM), svg.clientWidth/2, svg.clientHeight/2);

function toMM(e){
  const pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
  return pt.matrixTransform(svg.getScreenCTM().inverse());
}

/* ======================= 吸附 ======================= */
const grid = () => 10;
function snapMove(f, cx, cy){
  let nx = Math.round(cx/grid())*grid(), ny = Math.round(cy/grid())*grid();
  if (!ui.layers.wallSnap) return [nx, ny];
  const {hw, hh} = aabb(f), tol = 10/view.s;
  let bx = tol, by = tol;
  for (const r of snapRects()){
    if (!(r[3] < cy-hh-tol || r[1] > cy+hh+tol)) for (const ex of [r[0], r[2]]) for (const c of [ex+hw, ex-hw]) if (Math.abs(c-cx) < bx){ bx = Math.abs(c-cx); nx = c; }
    if (!(r[2] < cx-hw-tol || r[0] > cx+hw+tol)) for (const ey of [r[1], r[3]]) for (const c of [ey+hh, ey-hh]) if (Math.abs(c-cy) < by){ by = Math.abs(c-cy); ny = c; }
  }
  return [nx, ny];
}
function snapPoint(p, shift){
  let x = Math.round(p.x/10)*10, y = Math.round(p.y/10)*10;
  const tol = 8/view.s; let bx = tol, by = tol;
  for (const r of snapRects()){
    for (const ex of [r[0], r[2]]) if (Math.abs(ex-p.x) < bx){ bx = Math.abs(ex-p.x); x = ex; }
    for (const ey of [r[1], r[3]]) if (Math.abs(ey-p.y) < by){ by = Math.abs(ey-p.y); y = ey; }
  }
  if (shift && ui.mA){ if (Math.abs(x-ui.mA.x) > Math.abs(y-ui.mA.y)) y = ui.mA.y; else x = ui.mA.x; }
  return {x, y};
}

/* ======================= 指针交互 ======================= */
let drag = null, pinch = null;
const touches = new Map();                     // 当前按在平面图上的手指
const svgXY = (x, y) => { const r = svg.getBoundingClientRect(); return [x - r.left, y - r.top]; };
function pinchInfo(){
  const [a, b] = [...touches.values()];
  return {d:Math.max(1, Math.hypot(b.x-a.x, b.y-a.y)), c:svgXY((a.x+b.x)/2, (a.y+b.y)/2)};
}
// 结束当前拖动：移动过的家具记入撤销栈
function endDrag(cancel){
  const d = drag; drag = null; svg.classList.remove('panning');
  if (!d) return;
  if (d.kind === 'measure'){
    if (cancel){ ui.mA = ui.mCur = null; renderMeasure(); return; }
    if (d.moved && ui.mA && ui.mCur && Math.hypot(ui.mCur.x-ui.mA.x, ui.mCur.y-ui.mA.y) > 20){
      const a = ui.mA, b = ui.mCur; ui.mA = ui.mCur = null; mutate(() => state.measures.push({a, b}));
    }
    renderMeasure(); return;                   // 没拖动：保留起点，等第二次点击
  }
  if (d.kind === 'pan'){
    if (!cancel && !d.moved && ui.tool === 'select'){
      if (d.dimHit) editDim(d.dimHit, d.sx, d.sy);
      else select(d.room ? {kind:'room', id:d.room} : null);
    }
    return;
  }
  if (d.kind === 'draw'){
    const cur = ui.drawCur; ui.drawCur = null;
    if (!cancel && cur){
      const r = drawWallRect(d.a, cur);
      if (r){
        if (!state.layout) state.layout = {walls:[], wins:[], doors:[], slides:[], rooms:[]};
        mutate(() => state.layout.walls.push(r));
        applyLayout();
        editNewWall(state.layout.walls.length-1, d.sx, d.sy);
      }
    }
    renderAll(); return;
  }
  if (d.kind === 'wmove'){
    if (d.moved){
      if (cancel){ state = JSON.parse(d.before); applyLayout(); }
      else { syncRoomsToWalls(); commit(d.before); }
      renderAll();
    } else if (!cancel && d.dimHit) editWallLen(d.idx, d.sx, d.sy);
    return;
  }
  if (d.kind === 'opmove'){
    if (d.moved){
      if (cancel){ state = JSON.parse(d.before); applyLayout(); }
      else commit(d.before);
      renderAll();
    }
    return;
  }
  if (d.moved){ commit(d.before); renderAll(); }
}
// 手绘取点：50mm 网格 + 吸附已有墙体端点
function snapWallPt(p){
  let x = Math.round(p.x/50)*50, y = Math.round(p.y/50)*50;
  const tol = 12/view.s; let bd = tol;
  WALLS.forEach(w => [[w[0],w[1]],[w[2],w[3]],[w[0],w[3]],[w[2],w[1]]].forEach(([cx,cy]) => {
    const d = Math.hypot(cx-p.x, cy-p.y);
    if (d < bd){ bd = d; x = cx; y = cy; }
  }));
  return [x, y];
}

svg.addEventListener('pointerdown', e => {
  if (e.button === 1 || e.button === 2) return;
  closeDrawers(); $('details.menu').open = false;
  if (e.pointerType !== 'mouse'){
    touches.set(e.pointerId, {x:e.clientX, y:e.clientY});
    svg.setPointerCapture(e.pointerId);
    if (touches.size >= 2){                    // 第二根手指落下：取消单指操作，进入双指缩放 / 平移
      endDrag(drag?.kind === 'measure' || drag?.kind === 'pan');
      const {d, c} = pinchInfo();
      pinch = {d, c, s:view.s, px:view.x0 + c[0]/view.s, py:view.y0 + c[1]/view.s};
      return;
    }
  }
  if (pinch) return;
  const p = toMM(e), t = e.target;
  if (ui.tool === 'measure'){
    const q = snapPoint(p, e.shiftKey);
    if (!ui.mA){ ui.mA = q; ui.mCur = q; drag = {kind:'measure', sx:e.clientX, sy:e.clientY, moved:false}; svg.setPointerCapture(e.pointerId); }
    else { const a = ui.mA; ui.mA = null; ui.mCur = null; if (Math.hypot(q.x-a.x, q.y-a.y) > 20) mutate(() => state.measures.push({a, b:q})); }
    renderMeasure(); return;
  }
  if (ui.tool === 'draw'){
    const wl = t.closest('[data-wall]');
    if (wl){                                   // 点选已有墙体（Delete 删除，Esc 取消选中）
      ui.wallSel = wl.dataset.wall; drag = null;
      renderWalls(); renderSel(); renderFab(); return;
    }
    if (ui.wallSel){ ui.wallSel = null; renderFab(); }
    const q = snapWallPt(p);
    drag = {kind:'draw', a:q, sx:e.clientX, sy:e.clientY, moved:false};
    ui.drawCur = q;
    svg.setPointerCapture(e.pointerId);
    renderWalls(); renderSel(); return;
  }
  const h = t.closest('[data-handle]');
  if (h && ui.sel?.kind === 'furn'){
    drag = {kind:h.dataset.handle, id:ui.sel.id, sx:e.clientX, sy:e.clientY, before:snap(), moved:false};
  } else if (ui.tool === 'demolish' && t.closest('[data-wall]')){
    toggleWall(t.closest('[data-wall]').dataset.wall); return;
  } else if (ui.tool === 'select' && t.closest('[data-fid]')){
    const f = getF(t.closest('[data-fid]').dataset.fid);
    if (ui.wallSel){ ui.wallSel = null; renderWalls(); }
    ui.opSel = null;
    if (ui.sel?.id !== f.id) select({kind:'furn', id:f.id});
    drag = {kind:'move', id:f.id, sx:e.clientX, sy:e.clientY, ox:p.x-f.cx, oy:p.y-f.cy, before:snap(), moved:false};
  } else if (ui.tool === 'select' && t.closest('[data-op]')){
    const os = parseOp(t.closest('[data-op]').dataset.op), op = getOp(os);
    if (!op){ ui.opSel = null; renderSel(); renderPanel(); return; }
    ui.sel = null; ui.wallSel = null; ui.opSel = os;
    const r = op.rect, hz = (r[2]-r[0]) >= (r[3]-r[1]);
    drag = {kind:'opmove', os, horiz:hz, off: hz ? p.x-(r[0]+r[2])/2 : p.y-(r[1]+r[3])/2, sx:e.clientX, sy:e.clientY, before:snap(), moved:false, range:opRange(os, op)};
    svg.setPointerCapture(e.pointerId);
    renderOpenings(); renderSel(); renderPanel(); return;
  } else if (ui.tool === 'select' && (t.closest('[data-wall]') || t.closest('[data-wlen]'))){
    const wl = t.closest('[data-wall]');
    const wi = wl ? +wl.dataset.wall.slice(1) : +t.closest('[data-wlen]').dataset.wlen;
    const ww = WALLS[wi];
    ui.sel = null; ui.opSel = null; ui.wallSel = 'w'+wi;
    const hz = ww ? (ww[2]-ww[0]) >= (ww[3]-ww[1]) : true;
    drag = {kind:'wmove', idx:wi, off: ww ? (hz ? p.y - ww[1] : p.x - ww[0]) : 0, offA: ww ? (hz ? p.x - (ww[0]+ww[2])/2 : p.y - (ww[1]+ww[3])/2) : 0, sx:e.clientX, sy:e.clientY, before:snap(), moved:false, dimHit: !wl};
    svg.setPointerCapture(e.pointerId);
    renderWalls(); renderSel(); renderPanel(); return;
  } else {
    if (ui.tool === 'select' && (ui.wallSel || ui.opSel)){ ui.wallSel = null; ui.opSel = null; renderWalls(); renderSel(); renderPanel(); }
    const room = t.closest('[data-room]');
    drag = {kind:'pan', sx:e.clientX, sy:e.clientY, x0:view.x0, y0:view.y0, room:room && room.dataset.room, moved:false, dimHit: (t.dataset && t.dataset.dim) || null};
  }
  svg.setPointerCapture(e.pointerId);
});

svg.addEventListener('pointermove', e => {
  if (touches.has(e.pointerId)) touches.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if (pinch){
    if (touches.size < 2) return;
    const {d, c} = pinchInfo(), ns = Math.max(.012, Math.min(2, pinch.s * d / pinch.d));
    view.s = ns; view.x0 = pinch.px - c[0]/ns; view.y0 = pinch.py - c[1]/ns; applyView();
    return;
  }
  const p = toMM(e);
  $('#cx').textContent = Math.round(p.x) + ' mm'; $('#cy').textContent = Math.round(p.y) + ' mm';
  if (!drag){
    const room = e.target.closest && e.target.closest('[data-room]');
    $('#hover').innerHTML = room ? `<b>${esc(state.rooms[room.dataset.room].name)}</b> ${fmt(area(ROOMS.find(r=>r.id===room.dataset.room).poly))} m²` : '';
    if (ui.tool === 'measure' && ui.mA){ ui.mCur = snapPoint(p, e.shiftKey); renderMeasure(); }
    return;
  }
  const far = Math.hypot(e.clientX-drag.sx, e.clientY-drag.sy) >= TAP;
  if (drag.kind === 'measure'){
    if (far) drag.moved = true;
    ui.mCur = snapPoint(p, e.shiftKey); renderMeasure(); return;
  }
  if (drag.kind === 'pan'){
    if (!drag.moved && !far) return;
    drag.moved = true; svg.classList.add('panning');
    view.x0 = drag.x0 - (e.clientX-drag.sx)/view.s; view.y0 = drag.y0 - (e.clientY-drag.sy)/view.s; applyView(); return;
  }
  if (drag.kind === 'draw'){
    if (far) drag.moved = true;
    ui.drawCur = snapWallPt(p); renderWalls(); return;
  }
  if (drag.kind === 'wmove'){
    if (!drag.moved && !far) return;
    drag.moved = true;
    const w = WALLS[drag.idx]; if (!w) return;
    const hz = (w[2]-w[0]) >= (w[3]-w[1]);
    const nt = Math.round(((hz ? p.y : p.x) - drag.off)/10)*10;
    const dn = nt - (hz ? w[1] : w[0]);
    const at = Math.round(((hz ? p.x : p.y) - (drag.offA || 0))/10)*10;
    const da = at - Math.round((hz ? (w[0]+w[2]) : (w[1]+w[3]))/2);
    const dx = hz ? da : dn, dy = hz ? dn : da;
    if (dx || dy){ shiftWallAxial(drag.idx, dx, dy); renderRooms(); renderOpenings(); renderDims(); renderWalls(); renderSel(); }
    return;
  }
  if (drag.kind === 'opmove'){
    if (!drag.moved && !far) return;
    drag.moved = true;
    const op = getOp(drag.os); if (!op) return;
    const r = op.rect;
    const cur = drag.horiz ? (r[0]+r[2])/2 : (r[1]+r[3])/2;
    const target = Math.round(Math.max(drag.range[0], Math.min(drag.range[1], (drag.horiz ? p.x : p.y) - drag.off))/10)*10;
    const d = target - cur;
    if (d){
      if (drag.horiz){ r[0] += d; r[2] += d; } else { r[1] += d; r[3] += d; }
      if (drag.os.t === 'door'){ const dr = state.layout.doors[drag.os.i]; dr.h[0] += drag.horiz ? d : 0; dr.h[1] += drag.horiz ? 0 : d; }
      renderOpenings(); renderSel(); renderDims();
    }
    return;
  }
  const f = getF(drag.id); if (!f) return;
  if (!drag.moved && !far) return;             // 轻点家具不应让它抖动一下
  drag.moved = true;
  if (drag.kind === 'move'){
    [f.cx, f.cy] = snapMove(f, p.x-drag.ox, p.y-drag.oy);
  } else if (drag.kind === 'rot'){
    let a = Math.atan2(p.y-f.cy, p.x-f.cx)*180/Math.PI + 90;
    f.rot = norm(e.shiftKey ? a : Math.round(a/15)*15);
  } else if (drag.kind === 'size'){
    const a = f.rot*Math.PI/180, c = Math.cos(a), s = Math.sin(a);
    const dx = p.x-f.cx, dy = p.y-f.cy, lx = dx*c + dy*s, ly = -dx*s + dy*c;
    const ax = -f.w/2, ay = -f.d/2;
    const nw = Math.max(100, Math.round((lx-ax)/10)*10), nd = Math.max(100, Math.round((ly-ay)/10)*10);
    const mx = ax + nw/2, my = ay + nd/2;
    f.cx += mx*c - my*s; f.cy += mx*s + my*c; f.w = nw; f.d = nd;
  }
  renderFurn(); renderSel();
});

function onPointerEnd(e){
  touches.delete(e.pointerId);

  endDrag(e.type === 'pointercancel');
}

document.addEventListener('keydown', e => {
  if (e.target.matches('input,select,textarea')) return;
  if (window.View3D?.walking()) return;
  const mod = e.metaKey || e.ctrlKey, k = e.key.toLowerCase();
  if (mod && k === 'z'){ e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if (mod && k === 'y'){ e.preventDefault(); redo(); return; }
  if (mod && k === 'd'){ e.preventDefault(); duplicateSel(); return; }
  if (mod) return;
  if (k === '[' || k === ']'){ drawer(k === '[' ? 'lib' : 'panel'); return; }
  if (k === 'f' && e.shiftKey){ toggleFullscreen(); return; }
  if (k === 't') setView(is3D() ? '2d' : '3d');
  else if (is3D() && ['v','m','x','f','+','=','-'].includes(k)) return;
  else if (k === 'v') setTool('select');
  else if (k === 'm') setTool('measure');
  else if (k === 'd') setTool('draw');
  else if (k === 'x') setTool('demolish');
  else if (k === 'f') fitView();
  else if (k === 'r') rotateSel(e.shiftKey ? -90 : 90);
  else if (k === 'delete' || k === 'backspace'){ e.preventDefault(); deleteSel(); }
  else if (k === 'escape'){
    if (ui.wallSel){ ui.wallSel = null; renderWalls(); renderSel(); renderFab(); }
    else if (ui.mA){ ui.mA = null; renderMeasure(); }
    else { if (ui.tool !== 'select') setTool('select'); select(null); }
  }
  else if (k.startsWith('arrow') && ui.sel?.kind === 'furn'){
    e.preventDefault(); const st = e.shiftKey ? 100 : 10;
    mutate(() => { const f = getF(ui.sel.id); if (k==='arrowleft') f.cx -= st; if (k==='arrowright') f.cx += st; if (k==='arrowup') f.cy -= st; if (k==='arrowdown') f.cy += st; });
  }
  else if (k === '+' || k === '=') zoomCenter(1.25);
  else if (k === '-') zoomCenter(.8);
});

// 家具库拖放：用 pointer 事件实现（iPad 上 HTML5 拖放不可靠）。
// 列表设置了 touch-action:pan-y，竖向滑动交给浏览器滚动（会触发 pointercancel），横向拖动才开始拖放。
let libDrag = null;
// 屏幕坐标 → 户型坐标（mm）。2D 取平面图坐标，3D 取射线与地面的交点；s = 该处每 mm 的屏幕像素数
function dropPoint(x, y){
  const r = $('#stage').getBoundingClientRect();
  if (x < r.left || x > r.right || y < r.top || y > r.bottom) return null;
  if (document.elementFromPoint(x, y)?.closest('aside.open,#fab,#walkOverlay,#joy,#walkExit')) return null;
  if (is3D()) return window.View3D?.groundAt(x, y) || null;
  const p = toMM({clientX:x, clientY:y}); return {x:p.x, y:p.y, s:view.s};
}
addEventListener('pointermove', e => {
  if (!libDrag || e.pointerId !== libDrag.id) return;
  const {it} = libDrag;
  if (!libDrag.ghost){
    if (Math.hypot(e.clientX-libDrag.sx, e.clientY-libDrag.sy) < TAP) return;
    const g = libDrag.ghost = document.createElement('div'); g.id = 'ghost';
    g.innerHTML = `<svg viewBox="${-it[2]/2} ${-it[3]/2} ${it[2]} ${it[3]}">${furnSVG(it[0],it[2],it[3],it[4])}</svg>`;
    document.body.appendChild(g); libDrag.el.classList.add('dragging');
  }
  // 幽灵图按落点处的比例显示真实大小（3D 中近大远小）
  const g = libDrag.ghost, s = Math.max(dropPoint(e.clientX, e.clientY)?.s || (is3D() ? .05 : view.s), .02);
  Object.assign(g.style, {width:Math.max(28, it[2]*s)+'px', height:Math.max(20, it[3]*s)+'px', left:e.clientX+'px', top:e.clientY+'px'});
  const lib = $('aside.lib');
  if (narrow() && lib.classList.contains('open') && e.clientX > lib.getBoundingClientRect().right) drawer(null);   // 拖出抽屉后自动收起
});
function endLibDrag(e, ok){
  if (!libDrag || e.pointerId !== libDrag.id) return;
  const d = libDrag; libDrag = null;
  d.el.classList.remove('dragging');
  if (d.ghost){
    d.ghost.remove();
    if (!ok) return;
    const p = dropPoint(e.clientX, e.clientY);
    if (p){
      if (d.it[0].startsWith('op')){
        const nw = nearWall(p.x, p.y, 500);
        if (nw) addOpeningAt(nw.idx, d.it[0].slice(2), nw.pos, d.it[2]);
        else toast(tr('请拖到墙上再松手', 'Drop onto a wall'));
      } else addItem(d.it, p.x, p.y);
    }
    else if (is3D() && e.clientX > $('#stage').getBoundingClientRect().left) toast(tr('请拖到地面上', 'Drop it on the floor'));
    return;
  }
  if (!ok) return;
  // 轻点：放到选中房间中心，否则放到画面中心（3D 取屏幕中心对应的地面位置）
  let p = null;
  if (ui.sel?.kind === 'room'){ const b = bbox(ROOMS.find(r => r.id===ui.sel.id).poly); p = {x:(b[0]+b[2])/2, y:(b[1]+b[3])/2}; }
  else if (is3D()){ const r = $('#stage').getBoundingClientRect(); p = window.View3D.groundAt(r.left + r.width/2, r.top + r.height/2); }
  if (!p) p = {x:view.x0 + svg.clientWidth/2/view.s, y:view.y0 + svg.clientHeight/2/view.s};
  if (d.it[0].startsWith('op')){
    const wi = ui.wallSel ? +ui.wallSel.slice(1) : -1;
    const ww = WALLS[wi];
    if (ww) addOpeningAt(wi, d.it[0].slice(2), (w2h => w2h ? (ww[0]+ww[2])/2 : (ww[1]+ww[3])/2)((ww[2]-ww[0]) >= (ww[3]-ww[1])), d.it[2]);
    else toast(tr('先点选一堵墙，或直接把门窗拖到墙上', 'Select a wall first, or drag it onto a wall'));
  } else addItem(d.it, p.x, p.y);
  closeDrawers();
}
addEventListener('pointerup', e => endLibDrag(e, true));
addEventListener('pointercancel', e => endLibDrag(e, false));

function download(name, blob){ const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000); }
function exportPNG(){
  if (is3D()) return window.View3D.shot();
  const clone = svg.cloneNode(true), W = 3200, H = Math.round(W*BOUNDS.h/BOUNDS.w);
  clone.setAttribute('viewBox', `${BOUNDS.x} ${BOUNDS.y} ${BOUNDS.w} ${BOUNDS.h}`);
  clone.setAttribute('width', W); clone.setAttribute('height', H);
  clone.querySelector('#gSel').innerHTML = '';
  clone.querySelector('#gGrid').innerHTML = `<rect x="-20000" y="-20000" width="55000" height="55000" fill="${ui.layers.grid?'url(#grid)':'#f7f4ee'}"/>`;
  const bg = document.createElementNS('http://www.w3.org/2000/svg','rect');
  Object.entries({x:-20000,y:-20000,width:55000,height:55000,fill:'#f7f4ee'}).forEach(([k,v]) => bg.setAttribute(k,v));
  clone.insertBefore(bg, clone.querySelector('#gGrid'));
  const img = new Image();
  img.onload = () => {
    const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
    cv.getContext('2d').drawImage(img, 0, 0, W, H);
    cv.toBlob(b => download(tr('厨房DIY方案', 'kitchen-diy-design') + '.png', b));
  };
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(new XMLSerializer().serializeToString(clone));
}
